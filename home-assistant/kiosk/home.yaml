                          return `<div class="row hd"><span>Process</span><span>CPU</span><span>Memory</span></div>` + ps.map((p) =>
                            `<div class="row"><span class="pn">${esc(p.nombre)}${p.n > 1 ? `<small>×${p.n}</small>` : ''}</span>` +
                            `<span class="cpu"><i style="width:${(p.cpu / top * 100).toFixed(0)}%"></i><em>${p.cpu} %</em></span>` +
                            `<span class="mem">${mb(p.mem)}</span></div>`).join('');
                        ]]]
                    extra_styles: |
                      .row { display: grid; grid-template-columns: minmax(0, 1fr) 150px 80px; gap: 14px; align-items: center; height: 38px; font-size: 15px; }
                      .row + .row { border-top: 1px solid rgba(255, 255, 255, 0.06); }
