# Home (dashboard-home): the kiosk's fusion style, sized for a desktop browser.
# Same build as the kiosk: one view per tab here, merged by build_dashboard.py into a
# single view whose pages switch by #hash. The button-card templates of dashboard.yaml
# (fusion_tile, fusion_slider, fusion_media, kiosk_nav, fusion_page...) are added at
# build time, so they're used here as-is; the desk_* ones below make them bigger.
# Deploy: sh kiosk/deploy.sh home. Edit in HA with ?disable_km (kiosk-mode hides the header).

# HA's own sidebar stays (it's the desktop's navigation); the header goes, the tabs are ours.
# On a phone-sized window the header comes back, or there'd be no way to open the sidebar.
kiosk_mode:
  hide_header: true
  mobile_settings:
    custom_width: 900
    hide_header: false

# Desktop tile: 76 px tall (61 on the kiosk), fills its grid cell.
x-desk-tile-styles: &desk_tile_styles
  card:
    - width: 100%
    - height: 76px
  grid:
    - grid-template-columns: 76px minmax(0, 1fr)
  img_cell:
    - width: 46px
    - height: 46px
  icon:
    - width: 26px
  entity_picture:
    - width: 46px
    - height: 46px
  name:
    - padding-right: 14px
    - font-size: 17px
    - line-height: 21px
    - max-width: 100%
    - overflow: hidden
    - text-overflow: ellipsis
  state:
    - padding-right: 14px
    - font-size: 15.5px
    - line-height: 20px
    - max-width: 100%
    - overflow: hidden
    - text-overflow: ellipsis

button_card_templates:
  desk_tile:
    template: fusion_tile
    styles: *desk_tile_styles
    state_display: |
      [[[
        if (!entity) return '';
        const s = entity.state;
        const map = { on: 'On', off: 'Off', home: 'Home', not_home: 'Away', unavailable: 'Unavailable', unknown: 'Unknown' };
        if (map[s]) return map[s];
        if (/^\d{2}:\d{2}:\d{2}$/.test(s)) return s.slice(0, 5);
        const u = entity.attributes.unit_of_measurement;
        let v = s;
        if (s !== '' && !isNaN(s)) {
          const n = Number(s), a = Math.abs(n);
          v = String(a >= 100 ? Math.round(n) : a >= 10 ? Math.round(n * 10) / 10 : Math.round(n * 100) / 100);
        }
        if (u === '$') return `$${v}`;
        if (u && u.startsWith('$/')) return `$${v}${u.slice(1)}`;
        return u ? `${v} ${u}` : v;
      ]]]
    # button-card gives a card with its own width "max-width: fit-content": undo it so the tile fills its cell.
    extra_styles: |
      :host { max-width: none !important; flex: 1 1 auto !important; }

  # Read-only tile (plugs and anything that shouldn't be touched from here).
  desk_info:
    template: desk_tile
    tap_action: { action: none }
    hold_action: { action: none }

  desk_slider:
    template: fusion_slider
    variables:
      iw: 76
    styles: *desk_tile_styles
    # button-card gives a card with its own width "max-width: fit-content": undo it so the tile fills its cell.
    extra_styles: |
      :host { max-width: none !important; flex: 1 1 auto !important; }

  # Settings (input_number / input_datetime) as a slider instead of a tile that opens the history.
  desk_range:
    template: fusion_range
    variables:
      iw: 76
    styles: *desk_tile_styles
    extra_styles: |
      :host { max-width: none !important; flex: 1 1 auto !important; }
      #state[data-pv] { position: relative; visibility: hidden; }
      #state[data-pv]::after { content: attr(data-pv); visibility: visible; position: absolute; inset: 0; }
      .track {
        width: 100%;
        height: 100%;
        cursor: pointer;
        pointer-events: auto;
        touch-action: pan-y;
        -webkit-tap-highlight-color: transparent;
      }

  desk_time:
    template: desk_tile
    state_display: |
      [[[
        const d = new Date(entity.state);
        return isNaN(d) ? entity.state : d.toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
      ]]]

  desk_uptime:
    template: desk_tile
    state_display: |
      [[[
        const t = Date.now() - new Date(entity.state).getTime();
        if (isNaN(t)) return entity.state;
        const d = Math.floor(t / 864e5), h = Math.floor(t % 864e5 / 36e5), m = Math.floor(t % 36e5 / 6e4);
        return d ? `${d}d ${h}h` : `${h}h ${m}m`;
      ]]]

  desk_title:
    template: fusion_title
    styles:
      card:
        - margin: 0 0 12px
      name:
        - font-size: 30px
        - line-height: 38px

  desk_title_next:
    template: desk_title
    styles:
      card:
        - margin: 40px 0 12px

  # Big number with the last hours drawn under it (history of the entity) and
  # its min / max. variables.hours (24) is the span. History is fetched once per
  # entity every 5 minutes and shared by every card showing it (window.__deskSpark).
  desk_stat:
    show_icon: true
    show_name: true
    show_state: false
    tap_action: { action: more-info }
    hold_action: { action: more-info }
    variables:
      hours: 24
      # 1 = draw from 0 (power, usage); 0 = fit the line to its own range (temperatures).
      zero: 0
    custom_fields:
      val: |
        [[[
          if (!entity) return '';
          const s = entity.state, u = entity.attributes.unit_of_measurement || '';
          if (s === '' || isNaN(s)) return `<span class="v na">${s}</span>`;
          const n = Number(s), a = Math.abs(n);
          const v = a >= 100 ? Math.round(n) : a >= 10 ? Math.round(n * 10) / 10 : Math.round(n * 100) / 100;
          if (u === '$') return `<span class="v">$${v}</span>`;
          return `<span class="v">${v}</span><span class="u">${u}</span>`;
        ]]]
      spark: |
        [[[
          if (!entity) return '';
          const card = this, id = entity.entity_id, hrs = variables.hours, now = Date.now();
          const C = window.__deskSpark = window.__deskSpark || {};
          const key = `${id}|${hrs}|${variables.zero}`;
          const u = entity.attributes.unit_of_measurement || '';
          const W = 300, H = 56;
          const num = (n) => { const a = Math.abs(n); return a >= 100 ? Math.round(n) : a >= 10 ? Math.round(n * 10) / 10 : Math.round(n * 100) / 100; };
          const draw = (pts, t0, t1) => {
            if (pts.length < 2) return { svg: '', ext: '' };
            // Average per bucket (72 over the span); an empty bucket keeps the last value.
            const B = 72, out = [];
            let j = 0, last = null;
            for (let i = 0; i < B; i++) {
              const b = t0 + (t1 - t0) * (i + 1) / B;
              let sum = 0, n = 0;
              while (j < pts.length && pts[j][0] < b) { sum += pts[j][1]; n++; last = pts[j][1]; j++; }
              const v = n ? sum / n : last;
              if (v !== null) out.push([t0 + (t1 - t0) * (i + 0.5) / B, v]);
            }
            const vals = pts.map((p) => p[1]);
            const mn = Math.min(...vals), mx = Math.max(...vals);
            let lo = Math.min(...out.map((p) => p[1])), hi = Math.max(...out.map((p) => p[1]));
            if (variables.zero && lo > 0) lo = 0;
            if (hi === lo) { lo -= 1; hi += 1; }
            const pad = (hi - lo) * 0.12;
            const x = (t) => (t - t0) / (t1 - t0) * W;
            const y = (v) => H - 2 - (v - lo) / (hi - lo + pad) * (H - 6);
            const xy = out.map((p) => [x(p[0]), y(p[1])]);
            const f = (n) => n.toFixed(1);
            // d3 curveBasis, as in the kiosk's sidebar graph
            let d = `M${f(xy[0][0])},${f(xy[0][1])}`;
            let [x0, y0] = xy[0], [x1, y1] = xy[1];
            d += `L${f((5 * x0 + x1) / 6)},${f((5 * y0 + y1) / 6)}`;
            const bez = (xn, yn) => {
              d += `C${f((2 * x0 + x1) / 3)},${f((2 * y0 + y1) / 3)},${f((x0 + 2 * x1) / 3)},${f((y0 + 2 * y1) / 3)},${f((x0 + 4 * x1 + xn) / 6)},${f((y0 + 4 * y1 + yn) / 6)}`;
              x0 = x1; y0 = y1; x1 = xn; y1 = yn;
            };
            for (let i = 2; i < xy.length; i++) bez(xy[i][0], xy[i][1]);
            bez(x1, y1);
            d += `L${f(x1)},${f(y1)}`;
            const area = `${d}L${f(xy[xy.length - 1][0])},${H}L${f(xy[0][0])},${H}Z`;
            const svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">` +
              `<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">` +
              `<stop offset="0%" stop-color="#fff" stop-opacity="0.22"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>` +
              `<path d="${area}" fill="url(#sg)"/>` +
              `<path d="${d}" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
            const unit = u === '$' ? '' : ` ${u}`;
            return { svg, ext: `${hrs} h · min ${num(mn)} · max ${num(mx)}${unit}` };
          };
          const paint = (k) => {
            for (const c of C[k].cards) {
              if (!c.isConnected) { C[k].cards.delete(c); continue; }
              const r = c.shadowRoot;
              if (!r) continue;
              const sp = r.querySelector('.sp'), ex = r.querySelector('.x');
              if (sp) sp.innerHTML = C[k].svg;
              if (ex) ex.textContent = C[k].ext;
            }
          };
          if (!C[key]) C[key] = { t: 0, svg: '', ext: '', cards: new Set() };
          C[key].cards.add(card);
          if (now - C[key].t > 300000) {
            C[key].t = now;
            const t0 = now - hrs * 36e5;
            hass.connection.sendMessagePromise({
              type: 'history/history_during_period',
              start_time: new Date(t0).toISOString(),
              end_time: new Date(now).toISOString(),
              entity_ids: [id],
              minimal_response: true,
              no_attributes: true,
              significant_changes_only: false,
            }).then((res) => {
              const pts = (res[id] || [])
                .map((r) => [(r.lu || r.lc) * 1000, parseFloat(r.s)])
                .filter((p) => !isNaN(p[1]));
              // A value that never changed comes back as one point: draw it flat.
              if (pts.length === 1) pts.push([now, pts[0][1]]);
              Object.assign(C[key], draw(pts, t0, now));
              paint(key);
            }).catch(() => {});
          }
          return `<div class="sp">${C[key].svg}</div>`;
        ]]]
      ext: |
        [[[
          const C = window.__deskSpark || {};
          const k = entity ? `${entity.entity_id}|${variables.hours}|${variables.zero}` : '';
          return `<span class="x">${(C[k] && C[k].ext) || ''}</span>`;
        ]]]
    styles:
      card:
        - height: 168px
        - padding: 14px 16px 0
        - box-sizing: border-box
        - border: none
        - border-radius: 10.4px
        - box-shadow: none
        - overflow: hidden
        - background: rgba(0, 0, 0, 0.15)
        - font-family: '"Inter Variable", system-ui'
        - color: rgb(255, 255, 255)
      grid:
        - grid-template-areas: '"i n" "val val" "ext ext"'
        - grid-template-columns: 38px minmax(0, 1fr)
        - grid-template-rows: 38px auto auto
        - align-content: start
      img_cell:
        - width: 38px
        - height: 38px
        - border-radius: 50%
        - background: rgba(255, 255, 255, 0.08)
      icon:
        - width: 21px
        - color: rgba(255, 255, 255, 0.85)
      name:
        - justify-self: start
        - padding-left: 10px
        - font-size: 16px
        - font-weight: 500
        - color: rgba(255, 255, 255, 0.75)
      custom_fields:
        val:
          - justify-self: start
          - margin-top: 8px
        ext:
          - justify-self: start
        spark:
          - position: absolute
          - left: 0
          - right: 0
          - bottom: 0
          - height: 56px
    extra_styles: |
      .v { font-size: 34px; font-weight: 600; line-height: 40px; font-variant-numeric: tabular-nums; }
      .v.na { font-size: 20px; font-weight: 500; color: rgba(255, 255, 255, 0.45); }
      .u { margin-left: 5px; font-size: 16px; font-weight: 500; color: rgba(255, 255, 255, 0.6); }
      .x { font-size: 13px; line-height: 18px; color: rgba(255, 255, 255, 0.5); font-variant-numeric: tabular-nums; }
      .sp, .sp svg { display: block; width: 100%; height: 56px; }

  # Tab bar: the kiosk's, bigger.
  desk_tabs:
    template: fusion_tabs
    # A template (not a YAML list): a list would be merged item by item with the kiosk's tabs.
    variables:
      tabs: |
        [[[ return [['overview', 'Overview'], ['server', 'Server'], ['network', 'Network'], ['weather', 'Weather'],
          ['traffic', 'Traffic'], ['energy', 'Energy'], ['lights', 'Lights'], ['automations', 'Automations']]; ]]]
    styles:
      card:
        - margin: 0 0 34px
      custom_fields:
        tabs:
          - gap: 30px
    extra_styles: |
      .tab {
        position: relative;
        pointer-events: auto;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        flex: 0 0 auto;
        padding: 14px 11px 16px;
        margin: 0 -11px;
        font-size: 26px;
        font-weight: 700;
        line-height: 32px;
        color: rgba(255, 255, 255, 0.4);
        transition: color 0.15s;
      }
      .tab:hover { color: rgba(255, 255, 255, 0.7); }
      #tabs::-webkit-scrollbar, [id="tabs"]::-webkit-scrollbar { display: none; }
      .tab.active { color: rgb(255, 255, 255); }
      .tab.active::after {
        content: "";
        position: absolute;
        left: 11px;
        right: 11px;
        bottom: 9px;
        height: 2px;
        background: rgb(255, 255, 255);
      }

  # Haze on a desktop: fills its column, 360 px tall. The three dots of the kiosk
  # (tile size) don't apply here.
  desk_media:
    template: fusion_media
    styles:
      card:
        - width: 100%
        - height: 360px
      custom_fields:
        info:
          - left: 22px
          - right: 22px
          - bottom: 82px
        ctl:
          - bottom: 16px
          - gap: 24px
        dev:
          - display: none
    extra_styles: |
      :host { max-width: none !important; flex: 1 1 auto !important; grid-column: auto !important; }
      #bg .pic { position: absolute; inset: 0; background-size: cover; background-position: center; }
      #bg::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(10, 13, 16, 0) 0%, rgba(10, 13, 16, 0.35) 40%, rgba(10, 13, 16, 0.92) 78%, rgba(10, 13, 16, 0.97) 100%);
      }
      #bg ha-icon { --mdc-icon-size: 64px; margin-bottom: 90px; }
      .t, .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .t { font-size: 21px; font-weight: 600; line-height: 27px; }
      .s { font-size: 16px; line-height: 21px; color: rgba(255, 255, 255, 0.7); }
      .b {
        width: 46px; height: 46px; display: grid; place-items: center;
        cursor: pointer; pointer-events: auto; color: rgba(255, 255, 255, 0.85);
        border-radius: 50%; transition: transform 0.1s, background 0.15s;
      }
      .b:hover { background: rgba(255, 255, 255, 0.1); }
      .b ha-icon { --mdc-icon-size: 26px; }
      .b.on { color: rgb(242, 196, 107); }
      .b.main { width: 56px; height: 56px; background: rgba(255, 255, 255, 0.92); color: rgb(30, 33, 36); }
      .b.main ha-icon { --mdc-icon-size: 32px; }
      .b:active { transform: scale(0.92); }

  # Plain surface for the hand-made cards below (disks, processes, cores, lists).
  desk_panel:
    show_icon: false
    show_name: false
    show_state: false
    tap_action: { action: none }
    hold_action: { action: none }
    styles:
      card:
        - padding: 18px 20px
        - border: none
        - border-radius: 10.4px
        - box-shadow: none
        - background: rgba(0, 0, 0, 0.15)
        - font-family: '"Inter Variable", system-ui'
        - color: rgb(255, 255, 255)
      grid:
        - grid-template-areas: '"c"'
        - grid-template-columns: minmax(0, 1fr)
      custom_fields:
        c:
          - justify-self: stretch
          - text-align: left
          - pointer-events: auto

# ---- Shared building blocks (YAML anchors, expanded on save) ----

x-sidebar: &sidebar
  type: vertical-stack
  view_layout:
    grid-area: side
  card_mod:
    style: |
      :host {
        display: block;
        /* Fixed without "left": it stays where the grid puts it, right of HA's own sidebar. */
        position: fixed;
        top: 0;
        width: 400px;
        height: 100vh;
        overflow-y: auto;
        scrollbar-width: none;
        z-index: 1;
        box-sizing: border-box;
        padding: 0 28px 28px;
        background: rgba(0, 0, 0, 0.06);
        border-right: 1px solid rgba(115, 115, 115, 0.25);
        font-family: "Inter Variable", system-ui;
      }
      :host::-webkit-scrollbar { display: none; }
      @media (max-width: 1100px) {
        :host { position: static; width: auto; height: auto; border-right: none; border-bottom: 1px solid rgba(115, 115, 115, 0.25); }
      }
  cards:
    # Clock and date (live_clock keeps them up to date, see dashboard.yaml)
    - type: custom:button-card
      template: live_clock
      styles:
        card:
          - padding: 22px 0 0 4px
        grid:
          - grid-template-areas: '"time" "date"'
          - grid-template-columns: 1fr
        custom_fields:
          time:
            - font-size: 80px
            - font-weight: 500
            - line-height: 90px
            - letter-spacing: -1px
            - color: rgba(255, 255, 255, 0.85)
          date:
            - font-size: 19px
            - line-height: 24px
            - color: rgba(255, 255, 255, 0.7)
    # Now: condition, temperature and the details that matter.
    - type: custom:button-card
      entity: weather.clima
      show_icon: false
      show_name: false
      show_state: false
      tap_action: { action: more-info }
      custom_fields:
        now: |
          [[[
            const a = entity.attributes;
            const names = {'clear-night': 'Clear', cloudy: 'Cloudy', fog: 'Fog', hail: 'Hail', lightning: 'Storm',
              'lightning-rainy': 'Storm', partlycloudy: 'Partly cloudy', pouring: 'Pouring', rainy: 'Rain',
              snowy: 'Snow', 'snowy-rainy': 'Sleet', sunny: 'Sunny', windy: 'Windy', 'windy-variant': 'Windy', exceptional: 'Exceptional'};
            const day = (states['sun.sun'] || {}).state !== 'below_horizon';
            const icon = `/local/kiosk/meteocons/${entity.state}-${day ? 'day' : 'night'}.svg`;
            const r = (v) => v === undefined || v === null ? '-' : Math.round(v);
            return `<div class="top"><img src="${icon}"><div><div class="t">${r(a.temperature)}°</div>` +
              `<div class="c">${names[entity.state] || entity.state}</div></div></div>` +
              `<div class="det"><span><ha-icon icon="mdi:thermometer-lines"></ha-icon>Feels ${r(a.apparent_temperature)}°</span>` +
              `<span><ha-icon icon="mdi:water-percent"></ha-icon>${r(a.humidity)} %</span>` +
              `<span><ha-icon icon="mdi:weather-windy"></ha-icon>${r(a.wind_speed)} km/h</span></div>`;
          ]]]
      styles:
        card:
          - background: none
          - border: none
          - box-shadow: none
          - padding: 26px 0 0
          - font-family: '"Inter Variable", system-ui'
          - color: rgba(255, 255, 255, 0.85)
        grid:
          - grid-template-areas: '"now"'
        custom_fields:
          now:
            - justify-self: stretch
      extra_styles: |
        .top { display: flex; align-items: center; gap: 10px; }
        .top img { width: 96px; height: 96px; margin: -12px -4px -12px -10px; }
        .t { font-size: 52px; font-weight: 500; line-height: 58px; text-align: left; }
        .c { font-size: 17px; color: rgba(255, 255, 255, 0.7); text-align: left; }
        .det { display: flex; justify-content: space-between; margin-top: 16px; font-size: 15px; color: rgba(255, 255, 255, 0.7); }
        .det span { display: flex; align-items: center; gap: 5px; }
        .det ha-icon { --mdc-icon-size: 18px; width: 18px; height: 18px; display: flex; color: rgba(255, 255, 255, 0.5); }
    # Next hours (every 2 h) and the week, from Open-Meteo (packages/clima.yaml).
    - type: custom:button-card
      entity: sensor.clima_pronostico_horario
      show_icon: false
      show_name: false
      show_state: false
      tap_action: { action: more-info, entity: weather.clima }
      custom_fields:
        f: |
          [[[
            const cond = {0: 'sunny', 1: 'sunny', 2: 'partlycloudy', 3: 'cloudy', 45: 'fog', 48: 'fog',
              51: 'rainy', 53: 'rainy', 55: 'rainy', 56: 'snowy-rainy', 57: 'snowy-rainy',
              61: 'rainy', 63: 'rainy', 65: 'pouring', 66: 'snowy-rainy', 67: 'snowy-rainy',
              71: 'snowy', 73: 'snowy', 75: 'snowy', 77: 'snowy', 80: 'rainy', 81: 'rainy', 82: 'pouring',
              85: 'snowy', 86: 'snowy', 95: 'lightning-rainy', 96: 'lightning-rainy', 99: 'lightning-rainy'};
            const h = entity.attributes, d = (states['sensor.clima_pronostico_diario'] || {}).attributes || {};
            const now = Date.now() - 36e5;
            const hours = (h.time || []).map((t, i) => [t, i]).filter(([t]) => new Date(t).getTime() >= now)
              .filter((_, k) => k % 2 === 0).slice(0, 7);
            const strip = hours.map(([t, i]) => {
              // At night a clear sky is the moon (meteocons' sunny-night is still a sun).
              let c = cond[h.weather_code[i]] || 'cloudy';
              if (!h.is_day[i] && c === 'sunny') c = 'clear-night';
              const ic = c + (h.is_day[i] ? '-day' : '-night');
              const p = h.precipitation_probability[i];
              return `<div class="h"><div class="hh">${t.slice(11, 13)}h</div><img src="/local/kiosk/meteocons/${ic}.svg">` +
                `<div class="ht">${Math.round(h.temperature_2m[i])}°</div><div class="hp">${p ? p + '%' : ''}</div></div>`;
            }).join('');
            const days = (d.time || []).slice(0, 7);
            const lo = Math.min(...d.temperature_2m_min.slice(0, 7)), hi = Math.max(...d.temperature_2m_max.slice(0, 7));
            const week = days.map((t, i) => {
              const name = i === 0 ? 'Today' : new Date(t + 'T12:00:00').toLocaleDateString('en-US', {weekday: 'short'});
              const mn = d.temperature_2m_min[i], mx = d.temperature_2m_max[i], p = d.precipitation_probability_max[i];
              const l = (mn - lo) / (hi - lo || 1) * 100, w = (mx - mn) / (hi - lo || 1) * 100;
              return `<div class="d"><span class="dn">${name}</span>` +
                `<img src="/local/kiosk/meteocons/${cond[d.weather_code[i]] || 'cloudy'}-day.svg">` +
                `<span class="dp">${p >= 10 ? p + '%' : ''}</span><span class="lo">${Math.round(mn)}°</span>` +
                `<span class="bar"><i style="left:${l.toFixed(1)}%;width:${Math.max(w, 4).toFixed(1)}%"></i></span>` +
                `<span class="hi">${Math.round(mx)}°</span></div>`;
            }).join('');
            return `<div class="strip">${strip}</div><div class="lbl">This week</div><div class="week">${week}</div>`;
          ]]]
      styles:
        card:
          - background: none
          - border: none
          - box-shadow: none
          - padding: 26px 0 0
          - overflow: visible
          - font-family: '"Inter Variable", system-ui'
          - color: rgba(255, 255, 255, 0.85)
        grid:
          - grid-template-areas: '"f"'
        custom_fields:
          f:
            - justify-self: stretch
      extra_styles: |
        ha-card { overflow: visible !important; }
        .strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 14px;
          padding: 12px 0 10px; border-top: 1px solid rgba(255, 255, 255, 0.08); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .hh { color: rgba(255, 255, 255, 0.55); line-height: 18px; }
        .strip img { width: 40px; height: 40px; margin: 0 auto; display: block; }
        .ht { font-size: 15px; font-weight: 500; line-height: 20px; }
        .hp { height: 16px; font-size: 12px; line-height: 16px; color: rgb(75, 166, 237); }
        .lbl { margin: 22px 0 6px; font-size: 16px; text-align: left; color: rgba(255, 255, 255, 0.8); }
        .d { display: grid; grid-template-columns: 54px 36px 38px 30px minmax(0, 1fr) 30px; align-items: center;
          height: 38px; font-size: 15px; text-align: left; }
        .d img { width: 34px; height: 34px; }
        .dn { color: rgba(255, 255, 255, 0.85); }
        .dp { font-size: 12.5px; color: rgb(75, 166, 237); text-align: center; }
        .lo { color: rgba(255, 255, 255, 0.5); text-align: right; padding-right: 8px; }
        .hi { text-align: right; }
        .bar { position: relative; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.08); }
        .bar i { position: absolute; top: 0; bottom: 0; border-radius: 2px;
          background: linear-gradient(90deg, rgb(120, 180, 230), rgb(242, 196, 107)); }
    # Temperature, last 7 days (hourly statistics), with its range.
    - type: custom:button-card
      entity: sensor.clima_temperatura
      name: Temperature · 7 days
      show_icon: false
      show_state: false
      show_label: true
      label: |
        [[[ return `${entity.state} ${entity.attributes.unit_of_measurement || ''}`; ]]]
      tap_action: { action: more-info }
      custom_fields:
        graph: |
          [[[
            const W = 344, H = 90, card = this, now = Date.now();
            const draw = (rows) => {
              const pts = rows.map((r) => [new Date(r.start).getTime(), r.mean ?? r.state]).filter((p) => p[1] !== null && p[1] !== undefined);
              if (pts.length < 2) return '';
              const mn = Math.min(...pts.map((p) => p[1])), mx = Math.max(...pts.map((p) => p[1]));
              const lo = mn - 1, hi = mx + 1;
              const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
              const x = (t) => 1 + (t - t0) / (t1 - t0 || 1) * (W - 2);
              const y = (v) => (H - 1) - (v - lo) / (hi - lo) * (H - 2);
              const xy = pts.map((p) => [x(p[0]), y(p[1])]);
              const f = (n) => n.toFixed(2);
              let d = `M${f(xy[0][0])},${f(xy[0][1])}`;
              let [x0, y0] = xy[0], [x1, y1] = xy[1];
              d += `L${f((5 * x0 + x1) / 6)},${f((5 * y0 + y1) / 6)}`;
              const bez = (xn, yn) => {
                d += `C${f((2 * x0 + x1) / 3)},${f((2 * y0 + y1) / 3)},${f((x0 + 2 * x1) / 3)},${f((y0 + 2 * y1) / 3)},${f((x0 + 4 * x1 + xn) / 6)},${f((y0 + 4 * y1 + yn) / 6)}`;
                x0 = x1; y0 = y1; x1 = xn; y1 = yn;
              };
              for (let i = 2; i < xy.length; i++) bez(xy[i][0], xy[i][1]);
              bez(x1, y1);
              d += `L${f(x1)},${f(y1)}`;
              const area = `${d}L${f(xy[xy.length - 1][0])},${H - 1}L${f(xy[0][0])},${H - 1}Z`;
              // One tick per midnight
              let ticks = '';
              const m = new Date(t0); m.setHours(24, 0, 0, 0);
              for (let t = m.getTime(); t < t1; t += 864e5) ticks += `<line x1="${f(x(t))}" y1="0" x2="${f(x(t))}" y2="${H}" stroke="rgba(255,255,255,0.07)"/>`;
              return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">` +
                `<defs><linearGradient id="kg" x1="0" y1="0" x2="0" y2="1">` +
                `<stop offset="0%" stop-color="#fff" stop-opacity="0.45"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>` +
                ticks + `<path d="${area}" fill="url(#kg)"/><path d="${d}" fill="none" stroke="#fff" stroke-width="1"/></svg>` +
                `<div class="rg"><span>min ${Math.round(mn)}°</span><span>max ${Math.round(mx)}°</span></div>`;
            };
            const cache = window.__deskGraphs = window.__deskGraphs || {};
            const key = entity.entity_id;
            if (!cache[key] || now - cache[key].t > 600000) {
              cache[key] = { t: now, svg: cache[key] ? cache[key].svg : '' };
              hass.connection.sendMessagePromise({
                type: 'recorder/statistics_during_period',
                start_time: new Date(now - 7 * 864e5).toISOString(),
                end_time: new Date(now).toISOString(),
                statistic_ids: [key],
                period: 'hour',
              }).then((res) => {
                cache[key].svg = draw(res[key] || []);
                const el = card.shadowRoot && card.shadowRoot.getElementById('kgraph');
                if (el) el.innerHTML = cache[key].svg;
              }).catch(() => {});
            }
            return `<div id="kgraph">${cache[key].svg}</div>`;
          ]]]
      styles:
        card:
          - background: none
          - border: none
          - box-shadow: none
          - border-radius: 0
          - padding: 0
          - margin-top: 26px
          - font-family: '"Inter Variable", system-ui'
        grid:
          - grid-template-areas: '"n" "l" "graph"'
          - grid-template-rows: 22px 26px auto
        name:
          - justify-self: start
          - font-size: 16px
          - color: rgba(255, 255, 255, 0.8)
        label:
          - justify-self: start
          - font-size: 16px
          - color: rgba(255, 255, 255, 0.8)
        custom_fields:
          graph:
            - margin-top: 8px
            - line-height: 0
      extra_styles: |
        .rg { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; line-height: 16px; color: rgba(255, 255, 255, 0.5); }
    # Sun: today's sunrise and sunset, and how long the day is.
    - type: custom:button-card
      entity: sun.sun
      show_icon: false
      show_name: false
      show_state: false
      triggers_update: [sensor.sun_next_rising, sensor.sun_next_setting]
      tap_action: { action: javascript, javascript: "[[[ location.hash = 'sun'; ]]]" }
      custom_fields:
        s: |
          [[[
            const t = (id) => new Date((states[id] || {}).state).getTime();
            const up = entity.state === 'above_horizon';
            const rise = up ? t('sensor.sun_next_rising') - 864e5 : t('sensor.sun_next_rising');
            const set = t('sensor.sun_next_setting');
            const hm = (ms) => isNaN(ms) ? '--:--' : new Date(ms).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
            const len = set - rise, lh = Math.floor(len / 36e5), lm = Math.round(len % 36e5 / 6e4);
            return `<span><ha-icon icon="mdi:weather-sunset-up"></ha-icon>${hm(rise)}</span>` +
              `<span class="m">${isNaN(len) ? '' : `${lh} h ${lm} min of light`}</span>` +
              `<span><ha-icon icon="mdi:weather-sunset-down"></ha-icon>${hm(set)}</span>`;
          ]]]
      styles:
        card:
          - background: none
          - border: none
          - box-shadow: none
          - padding: 14px 0 0
          - margin-top: 22px
          - border-top: 1px solid rgba(255, 255, 255, 0.08)
          - border-radius: 0
          - font-family: '"Inter Variable", system-ui'
        grid:
          - grid-template-areas: '"s"'
        custom_fields:
          s:
            - justify-self: stretch
            - display: flex
            - justify-content: space-between
            - align-items: center
            - font-size: 15px
            - color: rgba(255, 255, 255, 0.8)
      extra_styles: |
        #s span { display: flex; align-items: center; gap: 6px; }
        #s .m { font-size: 13px; color: rgba(255, 255, 255, 0.5); }
        #s ha-icon { --mdc-icon-size: 20px; width: 20px; height: 20px; display: flex; color: rgba(255, 255, 255, 0.55); }

# Sidebar 400 px + content. Below 1100 px the sidebar goes on top.
x-layout: &layout
  grid-template-columns: 400px minmax(0, 1fr)
  grid-template-rows: auto
  grid-template-areas: '"side main"'
  grid-gap: 0
  margin: 0
  padding: 0
  card_margin: 0px
  mediaquery:
    "(max-width: 1100px)":
      grid-template-columns: minmax(0, 1fr)
      grid-template-areas: '"side" "main"'

x-main-layout: &main_layout
  padding: 30px 44px 56px
  margin: 0
  card_margin: 0px
  grid-template-columns: minmax(0, 1fr)
  grid-gap: 0
  mediaquery:
    "(max-width: 700px)":
      padding: 20px 16px 40px

x-tiles-layout: &tiles_layout
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr))
  grid-gap: 12px
  margin: 0
  padding: 0
  card_margin: 0px

x-stats-layout: &stats_layout
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr))
  grid-gap: 12px
  margin: 0
  padding: 0
  card_margin: 0px

# Two columns on a normal desktop, three on a very wide one, one on a narrow window.
x-columns-layout: &columns_layout
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
  grid-gap: 0 40px
  margin: 0
  padding: 0
  card_margin: 0px
  mediaquery:
    "(max-width: 1500px)":
      grid-template-columns: minmax(0, 1fr)
    "(min-width: 2400px)":
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr)

x-charts-layout: &charts_layout
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr))
  grid-gap: 12px
  margin: 0
  padding: 0
  card_margin: 0px

