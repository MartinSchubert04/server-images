                          const bars = n.map((v, i) => `<div class="core"><div class="col"><i style="height:${Math.max(2, v).toFixed(0)}%"></i></div>` +
                            `<span>${Math.round(v)}</span></div>`).join('');
                          return `<div class="nm">${entity.attributes.nombre || ''}<span>${n.length} threads</span></div><div class="cores">${bars}</div>`;
                        ]]]
                    extra_styles: |
                      .nm { display: flex; justify-content: space-between; font-size: 14px; color: rgba(255, 255, 255, 0.75); }
                      .nm span { color: rgba(255, 255, 255, 0.45); }
                      .cores { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
