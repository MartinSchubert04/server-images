          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout: *columns_layout
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:button-card
                    template: desk_title_next
                    name: Storage
                  # Disks from sensor.server_procesos (packages/consumo.yaml): used / free,
                  # and what fills the system disk.
                  - type: custom:button-card
                    template: desk_panel
                    entity: sensor.server_procesos
                    custom_fields:
                      c: |
                        [[[
                          const fmt = (b) => b >= 1e12 ? `${(b / 1e12).toFixed(2)} TB` : b >= 1e10 ? `${Math.round(b / 1e9)} GB` : `${(b / 1e9).toFixed(1)} GB`;
                          const names = {'/': 'System', '/mnt/c': 'Windows (C:)', '/mnt/pendrive': 'Pendrive'};
                          const cols = ['rgb(75, 166, 237)', 'rgb(242, 196, 107)', 'rgb(130, 200, 150)', 'rgb(230, 120, 120)',
                            'rgb(180, 150, 225)', 'rgb(100, 200, 205)', 'rgb(225, 165, 120)', 'rgb(200, 200, 200)'];
                          return (entity.attributes.discos || []).map((d) => {
                            const used = d.total - d.libre, pct = used / d.total * 100;
                            let bar = '', legend = '';
                            if (d.detalle && d.detalle.length) {
                              const parts = d.detalle.map((p, i) => [p.nombre, p.bytes, cols[i % cols.length]]);
                              const rest = used - d.detalle.reduce((s, p) => s + p.bytes, 0);
                              if (rest > 0) parts.push(['Other', rest, 'rgba(255, 255, 255, 0.3)']);
                              bar = parts.map(([, b, c]) => `<i style="width:${(b / d.total * 100).toFixed(2)}%;background:${c}"></i>`).join('');
                              legend = '<div class="lg">' + parts.map(([n, b, c]) =>
                                `<span><b style="background:${c}"></b>${n}<em>${fmt(b)}</em></span>`).join('') + '</div>';
                            } else {
                              const c = pct > 90 ? 'rgb(230, 120, 120)' : pct > 75 ? 'rgb(242, 196, 107)' : 'rgba(255, 255, 255, 0.8)';
                              bar = `<i style="width:${pct.toFixed(1)}%;background:${c}"></i>`;
                            }
                            return `<div class="dk"><div class="h"><span class="n">${names[d.letra] || d.letra}<small>${d.letra}</small></span>` +
                              `<span class="s">${fmt(used)} of ${fmt(d.total)} · <b>${fmt(d.libre)} free</b></span></div>` +
                              `<div class="bar">${bar}</div>${legend}</div>`;
                          }).join('');
