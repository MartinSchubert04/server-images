                      .cpu em { position: relative; padding-left: 8px; font-style: normal; font-size: 13.5px; line-height: 22px; font-variant-numeric: tabular-nums; }
                      .mem { text-align: right; color: rgba(255, 255, 255, 0.7); font-variant-numeric: tabular-nums; }
                  # The container HA runs in (System Monitor)
