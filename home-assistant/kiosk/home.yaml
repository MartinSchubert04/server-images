                      .n { font-size: 17px; font-weight: 600; }
                      .n small { margin-left: 8px; font-size: 13px; font-weight: 400; color: rgba(255, 255, 255, 0.45); }
                      .s { font-size: 14px; color: rgba(255, 255, 255, 0.6); white-space: nowrap; }
                      .s b { font-weight: 500; color: rgba(255, 255, 255, 0.85); }
                      .bar { display: flex; height: 10px; margin-top: 10px; border-radius: 5px; overflow: hidden; background: rgba(255, 255, 255, 0.08); }
                      .bar i { height: 100%; }
                      .lg { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 18px; margin-top: 12px; font-size: 13.5px; }
                      .lg span { display: flex; align-items: center; gap: 8px; color: rgba(255, 255, 255, 0.75); min-width: 0; }
                      .lg b { flex: none; width: 10px; height: 10px; border-radius: 3px; }
                      .lg em { margin-left: auto; font-style: normal; color: rgba(255, 255, 255, 0.5); font-variant-numeric: tabular-nums; }
                  - type: custom:button-card
                    template: desk_title_next
                    name: CPU cores
                  - type: custom:button-card
