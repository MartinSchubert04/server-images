                      .col i { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.75); transition: height 0.4s; }
                      .core span { font-size: 12px; color: rgba(255, 255, 255, 0.55); font-variant-numeric: tabular-nums; }
              - type: vertical-stack
                cards:
                  - type: custom:button-card
                    template: desk_title_next
                    name: Processes
                  - type: custom:button-card
                    template: desk_panel
                    entity: sensor.server_procesos
                    custom_fields:
                      c: |
                        [[[
                          const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
                          const ps = entity.attributes.procs || [];
