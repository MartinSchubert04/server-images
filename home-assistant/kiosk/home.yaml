  - title: Traffic
    path: traffic
    type: custom:grid-layout
    theme: MRTN Kiosk
    layout: *layout
    cards:
      - *sidebar
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout: *main_layout
        view_layout:
          grid-area: main
        cards:
          - type: custom:button-card
            template: desk_tabs
          - type: custom:button-card
            template: desk_title
            name: Route
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout: *stats_layout
            cards:
              - type: custom:button-card
                template: desk_stat
                entity: sensor.ruta_tiempo
                name: Travel time
                icon: mdi:motorbike
              - type: custom:button-card
                template: desk_stat
                entity: sensor.ruta_demora
                name: Traffic delay
                icon: mdi:car-brake-alert
                variables: { zero: 1 }
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              <<: *tiles_layout
              margin: 12px 0 0
            cards:
              - type: custom:button-card
                template: desk_tile
                entity: sensor.ruta_distancia
                name: Distance
                icon: mdi:map-marker-distance
              - type: custom:button-card
                template: desk_tile
                entity: sensor.ruta_en_moto
                name: Ride
                state_display: |
                  [[[ return entity.attributes.motivo ? `${entity.state} · ${entity.attributes.motivo}` : entity.state; ]]]
              - type: custom:button-card
                template: desk_tile
                entity: input_text.ruta_destino
                name: Swap route
                icon: mdi:swap-horizontal
                state_display: |
                  [[[ return `to ${entity.state ? entity.state.split(',')[0] : '-'}`; ]]]
                tap_action:
                  action: javascript
                  javascript: |
                    [[[
                      const o = states['input_text.ruta_origen'].state;
                      const d = states['input_text.ruta_destino'].state;
                      hass.callService('input_text', 'set_value', {entity_id: 'input_text.ruta_origen', value: d});
                      hass.callService('input_text', 'set_value', {entity_id: 'input_text.ruta_destino', value: o});
                    ]]]
              - type: custom:button-card
                template: desk_tile
                entity: sensor.clima_precipitacion
                name: Rain now
                icon: mdi:weather-pouring
              - type: custom:button-card
                template: desk_tile
                entity: sensor.clima_rafagas
                name: Gusts
                icon: mdi:weather-windy-variant
              - type: custom:button-card
                template: desk_time
                entity: sensor.sun_next_setting
                name: Sunset
                icon: mdi:weather-sunset-down
          # Origin / destination, where they landed, and the trip in Google Maps / Waze.
          - type: custom:button-card
            template: desk_panel
            entity: input_text.ruta_destino
            triggers_update: [input_text.ruta_origen, sensor.ruta_origen, sensor.ruta_destino]
            styles:
              card:
                - margin-top: 12px
            custom_fields:
              c: |
                [[[
                  const esc = (v) => String(v || '').replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
                  const o = states['input_text.ruta_origen'].state, d = entity.state;
                  const ll = ((states['sensor.ruta_destino'] || {}).state || '').split(',');
                  const geo = (id) => esc(((states[id] || {}).attributes || {}).display_name || 'address not found');
                  const gm = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(o)}&destination=${encodeURIComponent(d)}&travelmode=driving`;
                  const wz = ll.length === 2 ? `https://www.waze.com/ul?ll=${ll[0]}%2C${ll[1]}&navigate=yes` : '';
                  const edit = (id) => `event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'${id}'}}))`;
                  return `<div class="rt"><div class="pt" onclick="${edit('input_text.ruta_origen')}"><span class="k">From</span><span class="a">${esc(o)}</span><span class="g">${geo('sensor.ruta_origen')}</span></div>` +
                    `<ha-icon icon="mdi:arrow-right"></ha-icon>` +
                    `<div class="pt" onclick="${edit('input_text.ruta_destino')}"><span class="k">To</span><span class="a">${esc(d)}</span><span class="g">${geo('sensor.ruta_destino')}</span></div>` +
                    `<div class="ln"><a href="${gm}" target="_blank" rel="noreferrer">Google Maps</a>${wz ? `<a href="${wz}" target="_blank" rel="noreferrer">Waze</a>` : ''}</div></div>`;
                ]]]
            extra_styles: |
              .rt { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: 18px; align-items: center; }
              .pt { display: flex; flex-direction: column; gap: 3px; min-width: 0; cursor: pointer; padding: 6px 10px; margin: -6px -10px; border-radius: 8px; }
              .pt:hover { background: rgba(255, 255, 255, 0.05); }
              .k { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(255, 255, 255, 0.45); }
              .a { font-size: 16px; font-weight: 600; }
              .g { font-size: 13px; color: rgba(255, 255, 255, 0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
              .rt > ha-icon { --mdc-icon-size: 24px; width: 24px; height: 24px; display: flex; color: rgba(255, 255, 255, 0.4); }
              .ln { display: flex; gap: 10px; }
              .ln a { padding: 9px 14px; border-radius: 8px; background: rgba(255, 255, 255, 0.08); color: #fff; text-decoration: none; font-size: 14px; font-weight: 500; white-space: nowrap; }
              .ln a:hover { background: rgba(255, 255, 255, 0.16); }
              @media (max-width: 1300px) { .rt { grid-template-columns: minmax(0, 1fr); } .rt > ha-icon { display: none; } }
          - type: custom:button-card
            template: desk_title_next
            name: Live map
          - type: iframe
            url: https://embed.waze.com/iframe?zoom=12&lat=-34.59&lon=-58.54&ct=livemap
            aspect_ratio: 50%
            card_mod:
              style: |
                ha-card { overflow: hidden; }
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              <<: *charts_layout
              grid-template-columns: repeat(auto-fill, minmax(520px, 1fr))
              margin: 12px 0 0
            cards:
              - type: iframe
                url: https://embed.waze.com/iframe?zoom=14&lat=-34.59&lon=-58.54&ct=livemap
                aspect_ratio: 70%
                card_mod:
                  style: |
                    ha-card { overflow: hidden; }
              - type: iframe
                url: https://embed.waze.com/iframe?zoom=12&lat=-34.6037&lon=-58.3816&ct=livemap
                aspect_ratio: 70%
                card_mod:
                  style: |
                    ha-card { overflow: hidden; }

