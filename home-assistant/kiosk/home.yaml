  # Settings of the kiosk/light automations (packages/kiosk.yaml) and an on/off
  # list of every automation in HA.
  - title: Automations
    path: automations
    type: custom:grid-layout
    theme: MRTN Kiosk
    layout: *layout
    cards:
      - *sidebar
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout: *main_layout
        view_layout:
          grid-area: main
        cards:
          - type: custom:button-card
            template: desk_tabs
          - type: custom:button-card
            template: desk_title
            name: Kiosk
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout: *tiles_layout
            cards:
              - type: custom:button-card
                template: [desk_tile, schedule_popup]
                entity: input_text.kiosk_horarios
                name: Brightness
                variables:
                  kind: kiosk
              - type: custom:button-card
                template: [desk_tile, setting_popup]
                entity: input_number.kiosk_inactividad_min
                name: Back to Overview
              - type: custom:button-card
                template: [desk_tile, setting_popup]
                entity: input_number.kiosk_apagar_min
                name: Screen off after
                state_display: |
                  [[[ return Number(entity.state) ? `${Number(entity.state)} min` : 'Never'; ]]]
              - type: custom:button-card
                template: desk_slider
                entity: light.touchkio_mrtn_hub_display
                name: Kiosk screen
                tap_action: { action: none }
                view_layout:
                  grid-column: span 2
          - type: custom:button-card
            template: desk_title_next
            name: Automations
          # Every automation in HA, built at render time: new ones show up on their own.
          # Click to enable/disable.
          - type: custom:button-card
            template: desk_panel
            triggers_update: all
            styles:
              card:
                - background: none
                - padding: 0
            custom_fields:
              c: |
                [[[
                  const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
                  const ago = (t) => {
                    if (!t) return 'never ran';
                    const m = Math.floor((Date.now() - new Date(t).getTime()) / 6e4);
                    if (m < 1) return 'ran just now';
                    if (m < 60) return `ran ${m} min ago`;
                    if (m < 1440) return `ran ${Math.floor(m / 60)} h ago`;
                    return `ran ${Math.floor(m / 1440)} d ago`;
                  };
                  const autos = Object.values(states)
                    .filter((a) => a.entity_id.startsWith('automation.'))
                    .sort((a, b) => (a.attributes.friendly_name || '').localeCompare(b.attributes.friendly_name || ''));
                  const call = (id) => `(this.getRootNode().host.hass||document.querySelector('home-assistant').hass)` +
                    `.callService('automation','toggle',{entity_id:'${id}'})`;
                  return '<div class="grid">' + autos.map((a) => {
                    const on = a.state === 'on';
                    return `<div class="t ${on ? 'on' : ''}" onclick="event.stopPropagation();${call(a.entity_id)}">` +
                      `<div class="i"><ha-icon icon="${on ? 'mdi:robot' : 'mdi:robot-off-outline'}"></ha-icon></div>` +
                      `<div class="r"><div class="n">${esc(a.attributes.friendly_name || a.entity_id)}</div>` +
                      `<div class="s">${on ? 'on' : 'off'} · ${ago(a.attributes.last_triggered)}</div></div></div>`;
                  }).join('') + '</div>';
                ]]]
            extra_styles: |
              .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
              .t { display: flex; align-items: center; height: 76px; border-radius: 10.4px; background: rgba(0, 0, 0, 0.15);
                cursor: pointer; user-select: none; opacity: 0.55; }
              .t.on { opacity: 1; }
              .t:hover { background: rgba(255, 255, 255, 0.06); }
              .i { flex: 0 0 76px; display: flex; align-items: center; justify-content: center; }
              .i ha-icon { --mdc-icon-size: 26px; display: flex; align-items: center; justify-content: center;
                width: 46px; height: 46px; border-radius: 50%; color: #fff; }
              .t.on .i ha-icon { background: rgb(131, 129, 124); }
              .r { min-width: 0; padding-right: 14px; text-align: left; }
              .n { font-size: 17px; font-weight: 500; line-height: 21px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
              .s { font-size: 15px; line-height: 20px; color: rgba(255, 255, 255, 0.7); }

  # Opened from Martin on Overview. Not in the tab bar; any tab takes you back.
  - title: Map
    path: map
    subview: true
    type: custom:grid-layout
    theme: MRTN Kiosk
    layout: *layout
    cards:
      - *sidebar
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout: *main_layout
        view_layout:
          grid-area: main
        cards:
          - type: custom:button-card
            template: desk_tabs
          - type: custom:button-card
            template: desk_title
            entity: device_tracker.a35_martin
            name: |
              [[[
                const z = {home: 'Home', not_home: 'Away'};
                const b = states['sensor.a35_martin_battery_level'];
                return `Martin · ${z[entity.state] || entity.state}` + (b ? ` · ${b.state} %` : '');
              ]]]
          # MapTiler streets-v2-dark like ha-fusion (/local/kiosk/map.html, see kiosk/map.html).
          - type: custom:button-card
            entity: device_tracker.a35_martin
            show_icon: false
            show_name: false
            show_state: false
            tap_action: { action: none }
            custom_fields:
              map: |
                [[[
                  const a = entity.attributes, h = (states['zone.home'] || {}).attributes || {};
                  const qs = new URLSearchParams({
                    lat: a.latitude ?? '', lon: a.longitude ?? '', acc: a.gps_accuracy ?? '',
                    hlat: h.latitude ?? '', hlon: h.longitude ?? '', label: 'M',
                  });
                  return `<iframe src="/local/kiosk/map.html?${qs}" loading="lazy"></iframe>`;
                ]]]
            styles:
              card:
                - padding: 0
                - overflow: hidden
                - height: calc(100vh - 220px)
                - min-height: 360px
              grid:
                - grid-template-areas: '"map"'
                - height: 100%
              custom_fields:
                map:
                  - height: 100%
                  - pointer-events: auto
            extra_styles: |
              iframe { display: block; width: 100%; height: 100%; border: 0; }

  # Opened from the Sun tile on Overview and the sun row in the sidebar.
  - title: Sun
    path: sun
    subview: true
    type: custom:grid-layout
    theme: MRTN Kiosk
    layout: *layout
    cards:
      - *sidebar
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout: *main_layout
        view_layout:
          grid-area: main
        cards:
          - type: custom:button-card
            template: desk_tabs
          - type: custom:button-card
            template: desk_title
            entity: sun.sun
            name: |
              [[[ return `Sun · ${{above_horizon: 'Above horizon', below_horizon: 'Below horizon'}[entity.state] || entity.state}`; ]]]
          # Day arc: sunrise on the left, sunset on the right, the sun at its
          # current spot. At night it shows the next sunrise instead.
          - type: custom:button-card
            entity: sun.sun
            show_icon: false
            show_name: false
            show_state: false
            tap_action: { action: none }
            triggers_update: all
            custom_fields:
              arc: |
                [[[
                  const t = (id) => new Date((states[id] || {}).state).getTime();
                  const now = Date.now(), day = 864e5;
                  const nextRise = t('sensor.sun_next_rising'), nextSet = t('sensor.sun_next_setting');
                  const up = entity.state === 'above_horizon';
                  const rise = up ? nextRise - day : nextRise;
                  const set = nextSet;
                  const hm = (ms) => isNaN(ms) ? '--:--' : new Date(ms).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
                  const W = 800, H = 260, cx = 400, by = 220, rx = 340, ry = 180;
                  const pt = (f) => [cx - rx * Math.cos(Math.PI * f), by - ry * Math.sin(Math.PI * f)];
                  const path = (f0, f1) => {
                    let d = '';
                    for (let i = 0; i <= 80; i++) {
                      const [x, y] = pt(f0 + (f1 - f0) * i / 80);
                      d += `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`;
                    }
                    return d;
                  };
                  const f = up ? Math.min(1, Math.max(0, (now - rise) / (set - rise))) : null;
                  const elev = entity.attributes.elevation;
                  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%">` +
                    `<line x1="20" y1="${by}" x2="${W - 20}" y2="${by}" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>` +
                    `<path d="${path(0, 1)}" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-dasharray="4 6"/>`;
                  if (up) {
                    const [sx, sy] = pt(f);
                    svg += `<path d="${path(0, f)}" fill="none" stroke="rgb(242,196,107)" stroke-width="3"/>` +
                      `<circle cx="${sx}" cy="${sy}" r="20" fill="rgba(242,196,107,0.25)"/>` +
                      `<circle cx="${sx}" cy="${sy}" r="11" fill="rgb(242,196,107)"/>`;
                  }
                  svg += `<text x="${cx - rx}" y="${by + 28}" text-anchor="middle">${hm(rise)}</text>` +
                    `<text x="${cx + rx}" y="${by + 28}" text-anchor="middle">${hm(set)}</text>` +
                    `<text x="${cx}" y="${by - 50}" text-anchor="middle" class="big">` +
                    (up ? `${elev !== undefined ? Math.round(elev) + '° high' : ''}` : `Sunrise ${hm(nextRise)}`) + `</text></svg>`;
                  return svg;
                ]]]
            styles:
              card:
                - padding: 16px 20px 10px
              grid:
                - grid-template-areas: '"arc"'
              custom_fields:
                arc:
                  - justify-self: stretch
                  - max-width: 900px
                  - margin: 0 auto
                  - width: 100%
            extra_styles: |
              svg text { fill: rgba(255, 255, 255, 0.7); font: 500 17px "Inter Variable", system-ui; }
              svg text.big { fill: rgba(255, 255, 255, 0.9); font-size: 30px; font-weight: 600; }
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              <<: *tiles_layout
              margin: 12px 0 0
            cards:
              - type: custom:button-card
                template: desk_time
                entity: sensor.sun_next_dawn
                name: Dawn
                icon: mdi:weather-sunset-up
              - type: custom:button-card
                template: desk_time
                entity: sensor.sun_next_rising
                name: Sunrise
                icon: mdi:weather-sunset-up
              - type: custom:button-card
                template: desk_time
                entity: sensor.sun_next_noon
                name: Noon
                icon: mdi:white-balance-sunny
              - type: custom:button-card
                template: desk_time
                entity: sensor.sun_next_setting
                name: Sunset
                icon: mdi:weather-sunset-down
              - type: custom:button-card
                template: desk_time
                entity: sensor.sun_next_dusk
                name: Dusk
                icon: mdi:weather-sunset-down
              - type: custom:button-card
                template: desk_tile
                entity: sun.sun
                name: Elevation
                icon: mdi:angle-acute
                state_display: |
                  [[[ const e = entity.attributes.elevation; return e === undefined ? '-' : `${Math.round(e * 10) / 10}°`; ]]]
