                          max: 200
                        view_layout:
                          grid-column: span 2
              - type: vertical-stack
                cards:
                  - type: custom:button-card
                    template: fusion_title
                    name: Hardware
                  - type: custom:layout-card
                    layout_type: custom:grid-layout
                    layout: *tiles_layout
                    cards:
                      - type: custom:button-card
                        template: fusion_tile
                        entity: sensor.touchkio_mrtn_hub_memory_usage
                        name: Memory usage
                      - type: custom:button-card
                        template: fusion_tile
                        entity: sensor.touchkio_mrtn_hub_processor_usage
