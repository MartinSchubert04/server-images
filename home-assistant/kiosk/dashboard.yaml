            name: Stopwatch
          - type: custom:button-card
            template: sw_engine
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            custom_fields:
              ui: |
                [[[
                  const sw = window.__sw;
                  const stop = 'event.stopPropagation()';
                  const btn = (cls, icon, label, fn) =>
                    `<span class="btn ${cls}" onpointerup="${stop};window.__sw.${fn}()" onclick="${stop}" ` +
                    `onmousedown="${stop}" ontouchstart="${stop}" ontouchend="${stop}">` +
                    `<ha-icon icon="${icon}"></ha-icon><span>${label}</span></span>`;
                  return `<div class="wrap">` +
                    `<div class="swt fine big">${sw ? sw.fmt(sw.ms(), true) : '00:00.0'}</div>` +
                    `<div class="btns">` +
                    btn('swp main', sw && sw.start ? 'mdi:pause' : 'mdi:play', 'Start / Pause', 'toggle') +
                    btn('', 'mdi:flag-outline', 'Lap', 'lap') +
                    btn('', 'mdi:restore', 'Reset', 'reset') +
                    `</div><div class="swlaps">${sw ? sw.lapsHtml() : ''}</div></div>`;
                ]]]
            # Fills the rest of the screen under the title (same as the map).
            styles:
              card:
                - padding: 20px 16px
                - height: calc(100vh - 161px)
                - min-height: 300px
                - box-sizing: border-box
              grid:
                - grid-template-areas: '"ui"'
                - grid-template-rows: 100%
                - height: 100%
              custom_fields:
                ui:
                  - justify-self: stretch
                  - align-self: stretch
                  - height: 100%
                  - min-height: 0
                  - pointer-events: auto
            extra_styles: |
              .wrap {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 28px;
                height: 100%;
              }
              .big {
                font-size: clamp(72px, 13vw, 180px);
                font-weight: 500;
                line-height: 1;
                font-variant-numeric: tabular-nums;
                color: rgba(255, 255, 255, 0.9);
              }
              .btns { display: flex; gap: 16px; }
              .btn {
                display: flex;
                align-items: center;
                gap: 10px;
                height: 72px;
                padding: 0 28px;
                border-radius: 10.4px;
                background: rgba(255, 255, 255, 0.08);
                color: rgba(255, 255, 255, 0.85);
                font-size: 18px;
                font-weight: 500;
                cursor: pointer;
                pointer-events: auto;
                touch-action: manipulation;
                -webkit-tap-highlight-color: transparent;
                user-select: none;
              }
              .btn ha-icon { --mdc-icon-size: 28px; width: 28px; height: 28px; display: flex; }
              .btn.main { background: rgba(255, 255, 255, 0.85); color: rgb(48, 51, 52); }
              .btn:active { filter: brightness(1.3); }
              .swlaps { width: 100%; max-width: 520px; flex: 0 1 auto; min-height: 0; overflow-y: auto; }
              .lap {
                display: flex;
                justify-content: space-between;
                padding: 6px 4px;
                border-top: 1px solid rgba(255, 255, 255, 0.08);
                font-size: 15px;
                font-variant-numeric: tabular-nums;
                color: rgba(255, 255, 255, 0.7);
              }

  # Settings of the kiosk/light automations (packages/kiosk.yaml) and an on/off
  # list of every automation in HA. Tap a value to change it.
  - title: Automations
    path: automations
    type: custom:grid-layout
    theme: MRTN Kiosk
    layout: *layout
    cards:
      - *sidebar
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout: *main_layout
        view_layout:
          grid-area: main
        cards:
          - type: custom:button-card
            template: fusion_tabs
            variables:
              active: automations
          - type: custom:button-card
            template: fusion_title
            name: Kiosk
          # Two fixed columns: brightness bars on the left, times and timers (tap to set) on the
          # right. Each row pairs related settings.
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              <<: *tiles_layout
              grid-template-columns: 393.6px 192px
              grid-column-gap: 50px
            cards:
              - type: custom:button-card
                template: fusion_range
                entity: input_number.kiosk_brillo_noche
                name: Night brightness
              - type: custom:button-card
                template: [fusion_tile, setting_popup]
                entity: input_datetime.kiosk_noche_inicio
                name: Night from
              - type: custom:button-card
                template: fusion_range
                entity: input_number.kiosk_brillo_dia
                name: Day brightness
              - type: custom:button-card
                template: [fusion_tile, setting_popup]
                entity: input_datetime.kiosk_dia_inicio
                name: Day from
              - type: custom:button-card
                template: fusion_range
                entity: input_number.kiosk_brillo_atenuado
                name: Idle brightness
              - type: custom:button-card
                template: [fusion_tile, setting_popup]
                entity: input_number.kiosk_atenuar_min
                name: Dim after
              - type: custom:button-card
                template: fusion_range
                entity: input_number.kiosk_brillo_atenuado_noche
                name: Idle at night
              - type: custom:button-card
                template: [fusion_tile, setting_popup]
                entity: input_number.kiosk_inactividad_min
                name: Back to Overview
          - type: custom:button-card
            template: fusion_title_next
            name: Lights
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout: *tiles_layout
            cards:
              - type: custom:button-card
                template: [fusion_tile, setting_popup]
                entity: input_datetime.luces_atenuar_hora
                name: Dim from
              - type: custom:button-card
                template: fusion_range
                entity: input_number.luces_atenuar_brillo
                name: Dim to
                view_layout:
                  grid-column: span 2
              - type: custom:button-card
                template: [fusion_tile, setting_popup]
                entity: input_datetime.luces_apagar_hora
                name: Off at
              # Lights with the "Auto lights" label (the ones these automations control).
              - type: custom:button-card
                template: fusion_tile
                name: Auto lights
                icon: mdi:lightbulb-auto
                show_state: false
                tap_action: { action: none }
                triggers_update: all
                custom_fields:
                  s: |
                    [[[
                      const n = Object.values(hass.entities || {})
                        .filter(e => e.entity_id.startsWith('light.') && (e.labels || []).includes('auto_lights')).length;
                      return `${n} light${n === 1 ? '' : 's'}`;
                    ]]]
                styles:
                  custom_fields:
                    s:
                      - justify-self: start
                      - align-self: start
                      - padding-right: 11.52px
                      - font-size: 14.8px
                      - line-height: 18px
                      - color: rgba(255, 255, 255, 0.7)
          - type: custom:button-card
            template: fusion_title_next
            name: Automations
          # Every automation in HA, built at render time: new ones show up on their own.
          # Tap to enable/disable.
          - type: custom:button-card
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            triggers_update: all
            custom_fields:
              list: |
                [[[
                  const esc = v => String(v).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
                  const ago = t => {
                    if (!t) return 'never ran';
                    const m = Math.floor((Date.now() - new Date(t).getTime()) / 6e4);
                    if (m < 1) return 'ran just now';
                    if (m < 60) return `ran ${m} min ago`;
                    if (m < 1440) return `ran ${Math.floor(m / 60)} h ago`;
                    return `ran ${Math.floor(m / 1440)} d ago`;
                  };
                  const autos = Object.values(states)
                    .filter(a => a.entity_id.startsWith('automation.'))
                    .sort((a, b) => (a.attributes.friendly_name || '').localeCompare(b.attributes.friendly_name || ''));
                  const call = id => `(this.getRootNode().host.hass||document.querySelector('home-assistant').hass)` +
                    `.callService('automation','toggle',{entity_id:'${id}'})`;
                  const stop = 'event.stopPropagation()';
                  return '<div class="grid">' + autos.map(a => {
                    const on = a.state === 'on';
                    return `<div class="t ${on ? 'on' : ''}" onpointerup="${stop};${call(a.entity_id)}" onclick="${stop}" ` +
                      `onmousedown="${stop}" ontouchstart="${stop}" ontouchend="${stop}">` +
                      `<div class="i"><ha-icon icon="${on ? 'mdi:robot' : 'mdi:robot-off-outline'}"></ha-icon></div>` +
                      `<div class="r"><div class="n">${esc(a.attributes.friendly_name || a.entity_id)}</div>` +
                      `<div class="s">${on ? 'on' : 'off'} · ${ago(a.attributes.last_triggered)}</div></div></div>`;
                  }).join('') + '</div>';
                ]]]
            styles:
              card:
                - background: none
                - padding: 0
                - overflow: visible
              grid:
                - grid-template-areas: '"list"'
              custom_fields:
                list:
                  - justify-self: stretch
                  - pointer-events: auto
            extra_styles: |
              .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 9.6px; }
              .t {
                display: flex;
                align-items: center;
                height: 61px;
                border-radius: 10.4px;
                background: rgba(0, 0, 0, 0.15);
                font-family: "Inter Variable", system-ui;
                cursor: pointer;
                pointer-events: auto;
                touch-action: manipulation;
                -webkit-tap-highlight-color: transparent;
                user-select: none;
                opacity: 0.55;
              }
              .t.on { opacity: 1; }
              .t:active { filter: brightness(1.3); }
              .i {
                flex: 0 0 61px;
                display: flex;
                align-items: center;
                justify-content: center;
              }
              .i ha-icon {
                --mdc-icon-size: 22px;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 38px;
                height: 38px;
                border-radius: 50%;
                color: #fff;
              }
              .t.on .i ha-icon { background: rgb(131, 129, 124); }
              .r { min-width: 0; padding-right: 11.52px; text-align: left; }
              .n {
                font-size: 15.2px;
                font-weight: 500;
                line-height: 19px;
                color: #fff;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
              }
              .s { font-size: 14.8px; line-height: 18px; color: rgba(255, 255, 255, 0.7); }
