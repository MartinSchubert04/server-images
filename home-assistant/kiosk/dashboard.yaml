    cards:
      - *sidebar
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout: *main_layout
        view_layout:
          grid-area: main
        cards:
          - type: custom:button-card
            template: fusion_tabs
            variables:
              active: map
          - type: custom:button-card
            template: fusion_title
            entity: device_tracker.a35_martin
            name: |
              [[[ const z = { home: 'Home', not_home: 'Away' }; return `Martin · ${z[entity.state] || entity.state}`; ]]]
          # HA's own map card needs a CARTO API key now; this uses MapTiler
          # streets-v2-dark like ha-fusion (/local/kiosk/map.html, see kiosk/map.html).
          - type: custom:button-card
            entity: device_tracker.a35_martin
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            custom_fields:
              map: |
                [[[
                  const a = entity.attributes, h = (states['zone.home'] || {}).attributes || {};
                  const qs = new URLSearchParams({
                    lat: a.latitude ?? '', lon: a.longitude ?? '', acc: a.gps_accuracy ?? '',
                    hlat: h.latitude ?? '', hlon: h.longitude ?? '', label: 'M',
                  });
                  return `<iframe src="/local/kiosk/map.html?${qs}" loading="lazy"></iframe>`;
                ]]]
            styles:
              card:
                - padding: 0
                - overflow: hidden
                - height: calc(100vh - 161px)
                - min-height: 240px
              grid:
                - grid-template-areas: '"map"'
                - height: 100%
              custom_fields:
                map:
                  - height: 100%
                  - pointer-events: auto
            extra_styles: |
              iframe { display: block; width: 100%; height: 100%; border: 0; }

  # Opened from the Sun tile on Overview.
  - title: Sun
    path: sun
    subview: true
    type: custom:grid-layout
    theme: MRTN Kiosk
    layout: *layout
    cards:
      - *sidebar
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout: *main_layout
        view_layout:
          grid-area: main
        cards:
          - type: custom:button-card
            template: fusion_tabs
            variables:
              active: sun
          - type: custom:button-card
            template: fusion_title
            entity: sun.sun
            name: |
              [[[ return `Sun · ${{above_horizon: 'Above horizon', below_horizon: 'Below horizon'}[entity.state] || entity.state}`; ]]]
          # Day arc: sunrise on the left, sunset on the right, the sun at its
          # current spot. At night it shows the next sunrise instead.
          - type: custom:button-card
            entity: sun.sun
            show_icon: false
            show_name: false
            show_state: false
            tap_action:
              action: none
            triggers_update: all
            custom_fields:
              arc: |
                [[[
                  const t = id => new Date((states[id] || {}).state).getTime();
                  const now = Date.now(), day = 864e5;
                  const nextRise = t('sensor.sun_next_rising'), nextSet = t('sensor.sun_next_setting');
                  const up = entity.state === 'above_horizon';
                  const rise = up ? nextRise - day : nextRise;
                  // Below the horizon the next sunrise and sunset are the same (upcoming) day.
                  const set = nextSet;
                  const hm = ms => isNaN(ms) ? '--:--' : new Date(ms).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
                  const W = 600, H = 210, cx = 300, by = 180, rx = 250, ry = 150;
                  const pt = f => [cx - rx * Math.cos(Math.PI * f), by - ry * Math.sin(Math.PI * f)];
                  const path = (f0, f1) => {
                    let d = '';
                    for (let i = 0; i <= 60; i++) {
                      const [x, y] = pt(f0 + (f1 - f0) * i / 60);
                      d += `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`;
                    }
                    return d;
                  };
                  const f = up ? Math.min(1, Math.max(0, (now - rise) / (set - rise))) : null;
                  const elev = entity.attributes.elevation;
                  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%">` +
                    `<line x1="20" y1="${by}" x2="${W - 20}" y2="${by}" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>` +
                    `<path d="${path(0, 1)}" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-dasharray="4 6"/>`;
                  if (up) {
                    const [sx, sy] = pt(f);
                    svg += `<path d="${path(0, f)}" fill="none" stroke="rgb(242,196,107)" stroke-width="3"/>` +
                      `<circle cx="${sx}" cy="${sy}" r="16" fill="rgba(242,196,107,0.25)"/>` +
                      `<circle cx="${sx}" cy="${sy}" r="9" fill="rgb(242,196,107)"/>`;
                  }
                  svg += `<text x="${cx - rx}" y="${by + 24}" text-anchor="middle">${hm(rise)}</text>` +
                    `<text x="${cx + rx}" y="${by + 24}" text-anchor="middle">${hm(set)}</text>` +
                    `<text x="${cx}" y="${by - 40}" text-anchor="middle" class="big">` +
                    (up ? `${elev !== undefined ? Math.round(elev) + '° high' : ''}` : `Sunrise ${hm(nextRise)}`) + `</text></svg>`;
                  return svg;
                ]]]
            styles:
              card:
                - padding: 12px 16px 8px
              grid:
                - grid-template-areas: '"arc"'
              custom_fields:
                arc:
                  - justify-self: stretch
            extra_styles: |
              svg text { fill: rgba(255, 255, 255, 0.7); font: 500 15px "Inter Variable", system-ui; }
              svg text.big { fill: rgba(255, 255, 255, 0.9); font-size: 26px; font-weight: 600; }
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              <<: *tiles_layout
              margin: 9.6px 0 0
            cards:
              - type: custom:button-card
                template: fusion_time
                entity: sensor.sun_next_dawn
                name: Dawn
                icon: mdi:weather-sunset-up
              - type: custom:button-card
                template: fusion_time
                entity: sensor.sun_next_rising
                name: Sunrise
                icon: mdi:weather-sunset-up
              - type: custom:button-card
                template: fusion_time
                entity: sensor.sun_next_noon
                name: Noon
                icon: mdi:white-balance-sunny
              - type: custom:button-card
                template: fusion_time
                entity: sensor.sun_next_setting
                name: Sunset
                icon: mdi:weather-sunset-down
              - type: custom:button-card
                template: fusion_time
                entity: sensor.sun_next_dusk
                name: Dusk
                icon: mdi:weather-sunset-down
              - type: custom:button-card
                template: fusion_tile
                entity: sun.sun
                name: Elevation
                icon: mdi:angle-acute
                state_display: |
                  [[[ const e = entity.attributes.elevation; return e === undefined ? '-' : `${Math.round(e * 10) / 10}°`; ]]]

  # Opened from the Stopwatch tile on Overview.
  - title: Stopwatch
    path: stopwatch
    subview: true
    type: custom:grid-layout
    theme: MRTN Kiosk
    layout: *layout
    cards:
      - *sidebar
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout: *main_layout
