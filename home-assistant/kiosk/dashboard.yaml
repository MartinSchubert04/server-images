            layout: *columns_layout
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:button-card
                    template: fusion_title
                    name: State
                  - type: custom:layout-card
                    layout_type: custom:grid-layout
                    layout: *tiles_layout
                    cards:
                      - type: custom:button-card
