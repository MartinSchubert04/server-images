# MRTN-HUB kiosk dashboard: pixel clone of the ha-fusion "muted" layout.
# Requires HACS frontend: button-card, layout-card, card-mod, kiosk-mode.
# Edit it with ?disable_km appended to the URL (kiosk-mode hides the header).
# How it's deployed: each view below is one tab/page. build_dashboard.py merges
# them into a single Lovelace view where pages are shown/hidden by URL hash
# (#overview, #hub, ...), so the sidebar and tab bar never redraw on tab switch.
# Don't paste this file in the raw editor as-is: build it first.

kiosk_mode:
  hide_header: true
  hide_sidebar: true

button_card_templates:
  # ha-fusion button: 192x61, round icon on the left, name + state on the right.
  fusion_tile:
    show_state: true
    show_icon: true
    show_entity_picture: true
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    state_display: |
      [[[
        if (!entity) return '';
        const s = entity.state;
        const map = { home: 'Home', not_home: 'Away', unavailable: 'unavailable', unknown: 'unknown' };
        if (map[s]) return map[s];
        // Time helpers (input_datetime without date): "23:00:00" -> "23:00"
        if (/^\d{2}:\d{2}:\d{2}$/.test(s)) return s.slice(0, 5);
        const u = entity.attributes.unit_of_measurement;
        let v = s;
        // Long decimals (e.g. 16.2491 h) -> at most 2
        if (s !== '' && !isNaN(s) && (s.split('.')[1] || '').length > 2) v = String(Math.round(Number(s) * 100) / 100);
        // "10.0" -> "10"
        if (s !== '' && !isNaN(s) && Number(s) === Math.round(Number(s))) v = String(Math.round(Number(s)));
        if (u === '$') return `$${v}`;
        if (u && u.startsWith('$/')) return `$${v}${u.slice(1)}`;
        return u ? `${v} ${u}` : v;
      ]]]
    styles:
      card:
        - width: 192px
        - height: 61px
        - padding: 0
        - border: none
        - border-radius: 10.4px
        - box-shadow: none
        - background: rgba(0, 0, 0, 0.15)
        - font-family: '"Inter Variable", system-ui'
        - color: rgb(255, 255, 255)
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 61px 1fr
        - grid-template-rows: 1fr 1fr
      img_cell:
        - width: 38px
        - height: 38px
        - border-radius: 50%
        - justify-self: center
        - align-self: center
        # People get ha-fusion's blue avatar circle; active entities a grey one.
        - background: |
            [[[
              const domain = entity ? entity.entity_id.split('.')[0] : '';
              if (domain === 'device_tracker' || domain === 'person') return 'rgb(75, 166, 237)';
              return entity && entity.state === 'on' ? 'rgb(131, 129, 124)' : 'none';
            ]]]
      icon:
        - width: 22px
        - color: rgb(255, 255, 255)
      entity_picture:
        - width: 38px
        - height: 38px
        - border-radius: 50%
      name:
        - justify-self: start
        - align-self: end
        - padding-right: 11.52px
        - font-size: 15.2px
        - font-weight: 500
        - line-height: 19px
        - color: rgb(255, 255, 255)
      state:
        - justify-self: start
        - align-self: start
        - padding-right: 11.52px
        - font-size: 14.8px
        - line-height: 18px
        - color: rgba(255, 255, 255, 0.7)
    state:
      - value: "on"
        id: active_on
        styles: &active
          card:
            - background: rgba(255, 255, 255, 0.85)
          name:
            - color: rgb(48, 51, 52)
          state:
            - color: rgb(88, 90, 90)
      - value: home
        styles: *active

  # Brightness slider for any light: drag across the tile (fill = level).
  # Double width for touch; add `view_layout: {grid-column: span 2}` where used.
  fusion_slider:
    template: fusion_tile
    # Width of the icon column (61px on the kiosk; templates with a bigger tile change it).
    variables:
      iw: 61
    # Tap the icon to toggle; drag over the rest of the tile to set brightness.
    tap_action:
      action: toggle
    state_display: |
      [[[
        if (!entity || entity.state !== 'on') return entity ? entity.state : '';
        return `${Math.round((entity.attributes.brightness || 0) / 2.55)} %`;
      ]]]
    custom_fields:
      # Own pointer handling instead of <input type=range>: on touch a range
      # only reacts to drags, so a plain tap did nothing. Tap = jump to that
      # point, drag = live preview + light updates live, release = final send. A vertical
      # swipe makes the browser scroll (touch-action: pan-y) and fires pointercancel -> undo
      # of the preview (anything already sent while dragging stays).
      # The preview never writes into #state: button-card renders it with Lit and
      # overwriting its text breaks Lit (the card stops updating). The % goes in a
      # data-pv attribute shown by CSS, and 5 s after release the tile is repainted
      # from the real state in HA.
      slider: |
        [[[
          // The preview is a CSS variable (--sl-pv) on ha-card that the card's own background uses
          // instead of the HA value while it is set. button-card re-renders the background on every
          // state change (also the intermediate ones the live updates cause), so writing the
          // background directly made the fill jump back and forth. Released 5 s after letting go.
          const calc = `const r=this.getBoundingClientRect();` +
            `const v=Math.max(1,Math.min(100,Math.round((event.clientX-r.left)/r.width*100)));`;
          const paint = `const root=this.getRootNode();root.querySelector('ha-card').style.setProperty('--sl-pv',v);` +
            `const s=root.querySelector('#state');if(s)s.setAttribute('data-pv',v+' %');`;
          const clear = `const c=root.querySelector('ha-card');if(c)c.style.removeProperty('--sl-pv');` +
            `const s=root.querySelector('#state');if(s)s.removeAttribute('data-pv');`;
          const send = `const h=this.getRootNode().host;` +
            `(h.hass||document.querySelector('home-assistant').hass).callService('light','turn_on',` +
            `{entity_id:'${entity.entity_id}',brightness_pct:v});`;
          // While dragging the light follows too, at most every 250 ms (_ls = last send, _lv = last value).
          const live = `if(v!==this._lv&&Date.now()-(this._ls||0)>250){this._ls=Date.now();this._lv=v;` + send + `}`;
          const down = `this._d=1;this._lv=-1;this._ls=Date.now();clearTimeout(this._t);` +
            `try{this.setPointerCapture(event.pointerId)}catch(e){}` + calc + paint;
          const move = `if(!this._d)return;` + calc + paint + live;
          const up = `if(!this._d)return;this._d=0;event.stopPropagation();` + calc + paint + send +
            `const root=this.getRootNode();this._t=setTimeout(()=>{` + clear + `},5000);`;
          const cancel = `if(!this._d)return;this._d=0;const root=this.getRootNode();` +
            `this._t=setTimeout(()=>{` + clear + `},this._lv>0?5000:0);`;
          // Keep every event inside the track, or the card's own tap_action
          // (toggle, on Lights) would fire too.
          const stop = 'event.stopPropagation()';
          return `<div class="track" onpointerdown="event.stopPropagation();${down}" onpointermove="${move}" ` +
            `onpointerup="${up}" onpointercancel="${cancel}" onmousedown="${stop}" onmouseup="${stop}" ` +
            `ontouchstart="${stop}" ontouchend="${stop}" onclick="${stop}" ondblclick="${stop}"></div>`;
        ]]]
    styles:
      card:
        - width: 393.6px
        - background: |
            [[[
              const pct = entity && entity.state === 'on' ? Math.round((entity.attributes.brightness || 0) / 2.55) : 0;
              const at = `calc(${variables.iw}px + (100% - ${variables.iw}px) * var(--sl-pv, ${pct}) / 100)`;
              return `linear-gradient(90deg, rgba(255, 255, 255, 0.22) ${at}, rgba(0, 0, 0, 0.15) ${at})`;
            ]]]
      img_cell:
        - background: rgb(131, 129, 124)
      custom_fields:
        slider:
          - position: absolute
          - top: 0
          - bottom: 0
          - left: '[[[ return `${variables.iw}px`; ]]]'
          - right: 0
          - pointer-events: auto
    state:
      - value: "on"
        id: active_on
        styles:
          card:
            - background: |
                [[[
                  const pct = Math.round((entity.attributes.brightness || 0) / 2.55);
                  const at = `calc(${variables.iw}px + (100% - ${variables.iw}px) * var(--sl-pv, ${pct}) / 100)`;
                  return `linear-gradient(90deg, rgba(255, 255, 255, 0.22) ${at}, rgba(0, 0, 0, 0.15) ${at})`;
                ]]]
          name:
            - color: rgb(255, 255, 255)
          state:
            - color: rgba(255, 255, 255, 0.7)
    extra_styles: |
      #state[data-pv] { position: relative; visibility: hidden; }
      #state[data-pv]::after { content: attr(data-pv); visibility: visible; position: absolute; inset: 0; }
      .track {
        width: 100%;
        height: 100%;
        cursor: pointer;
        pointer-events: auto;
        touch-action: pan-y;
        -webkit-tap-highlight-color: transparent;
      }

  # Tap action for settings: opens our own small dialog instead of more-info (whose history
  # makes no sense for a setting). Use it on top of a tile: `template: [fusion_tile, setting_popup]`.
  # - input_datetime (time only): keypad to type the time (the keyboard works too), then ✓.
  # - input_number / number: big value, a bar to drag and - / + buttons. Saved on release.
  setting_popup:
    hold_action:
      action: none
    tap_action:
      action: javascript
      javascript: |
        [[[
          if (!entity) return;
          const id = entity.entity_id, domain = id.split('.')[0], a = entity.attributes;
          const isTime = domain === 'input_datetime';
          const title = (this._config && this._config.name) || a.friendly_name || id;
          // Only one dialog at a time; closing it also drops its keyboard listener.
          document.querySelectorAll('.mrtn-setting').forEach((e) => (e._close ? e._close() : e.remove()));

          const el = (tag, css, text) => {
            const e = document.createElement(tag);
            if (css) e.style.cssText = css;
            if (text !== undefined) e.textContent = text;
            return e;
          };
          const btnCss = 'border:none;border-radius:10.4px;background:rgba(255,255,255,0.1);color:#fff;' +
            'font:500 20px "Inter Variable",system-ui;cursor:pointer;touch-action:manipulation;' +
            '-webkit-tap-highlight-color:transparent;';
          const ov = el('div', 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.55);display:flex;' +
            'align-items:center;justify-content:center;font-family:"Inter Variable",system-ui;color:#fff;');
          ov.className = 'mrtn-setting';
          const box = el('div', 'width:min(320px,92vw);max-height:96vh;overflow:auto;box-sizing:border-box;' +
            'background:rgb(30,32,33);border-radius:16px;padding:12px 16px 16px;box-shadow:0 12px 40px rgba(0,0,0,0.5);');
          ov.appendChild(box);
          const head = el('div', 'display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;');
          head.appendChild(el('div', 'font-size:16px;font-weight:500;color:rgba(255,255,255,0.8);', title));
          const x = el('button', btnCss + 'width:36px;height:36px;font-size:18px;background:none;', '✕');
          head.appendChild(x);
          box.appendChild(head);
          const big = el('div', 'font-size:40px;font-weight:600;text-align:center;margin:0 0 12px;' +
            'font-variant-numeric:tabular-nums;letter-spacing:1px;');
          box.appendChild(big);
          let onKey = null;
          const close = () => { ov.remove(); if (onKey) document.removeEventListener('keydown', onKey); };
          ov._close = close;
          x.addEventListener('click', close);
          ov.addEventListener('click', (e) => { if (e.target === ov) close(); });

          if (isTime) {
            // Typed digits fill HH:MM from the left; the first key replaces the current time.
            const cur = String(entity.state).slice(0, 5);
            let digits = '', fresh = true;
            const parse = () => {
              const d = digits.length === 3 ? '0' + digits : digits;
              if (d.length !== 4) return null;
              const h = +d.slice(0, 2), m = +d.slice(2);
              return h < 24 && m < 60 ? d.slice(0, 2) + ':' + d.slice(2) : null;
            };
            const save = el('button', btnCss + 'height:44px;background:rgba(255,255,255,0.85);color:rgb(48,51,52);', '✓');
            const render = () => {
              if (fresh) { big.textContent = cur; big.style.color = '#fff'; }
              else {
                const p = (digits + '____').slice(0, 4);
                big.textContent = p.slice(0, 2) + ':' + p.slice(2);
                big.style.color = parse() ? '#fff' : 'rgba(255,255,255,0.6)';
              }
              save.disabled = !fresh && !parse();
              save.style.opacity = save.disabled ? '0.4' : '1';
            };
            const press = (k) => {
              if (k === 'del') { fresh = false; digits = digits.slice(0, -1); }
              else if (k === 'ok') { const t = fresh ? cur : parse(); if (!t) return;
                hass.callService('input_datetime', 'set_datetime', {entity_id: id, time: t + ':00'}); close(); return; }
              else { if (fresh) { digits = ''; fresh = false; } if (digits.length < 4) digits += k; }
              render();
            };
            const pad = el('div', 'display:grid;grid-template-columns:repeat(3,1fr);gap:8px;');
            ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'ok'].forEach((k) => {
              if (k === 'ok') { pad.appendChild(save); return; }
              const b = el('button', btnCss + 'height:44px;', k === 'del' ? '⌫' : k);
              b.addEventListener('click', () => press(k));
              pad.appendChild(b);
            });
            box.appendChild(pad);
            save.addEventListener('click', () => press('ok'));
            onKey = (e) => {
              if (/^[0-9]$/.test(e.key)) press(e.key);
              else if (e.key === 'Backspace') press('del');
              else if (e.key === 'Enter') press('ok');
              else if (e.key === 'Escape') close();
              else return;
              e.preventDefault();
            };
            document.addEventListener('keydown', onKey);
            render();
          } else {
            const lo = Number(a.min), hi = Number(a.max), st = Number(a.step) || 1;
            const unit = a.unit_of_measurement ? ' ' + a.unit_of_measurement : '';
            let v = Number(entity.state);
            const snap = (n) => Math.round(Math.max(lo, Math.min(hi, lo + Math.round((n - lo) / st) * st)) * 1000) / 1000;
            const row = el('div', 'display:flex;align-items:center;gap:10px;');
            const minus = el('button', btnCss + 'width:52px;height:52px;flex:none;font-size:26px;', '−');
            const plus = el('button', btnCss + 'width:52px;height:52px;flex:none;font-size:26px;', '+');
            const track = el('div', 'flex:1;height:52px;border-radius:10.4px;cursor:pointer;touch-action:none;');
            row.appendChild(minus); row.appendChild(track); row.appendChild(plus);
            box.appendChild(row);
            const range = el('div', 'display:flex;justify-content:space-between;margin:6px 62px 0;font-size:13px;' +
              'color:rgba(255,255,255,0.5);');
            range.appendChild(el('span', '', lo + unit)); range.appendChild(el('span', '', hi + unit));
            box.appendChild(range);
            const render = () => {
              const pc = (v - lo) / (hi - lo) * 100;
              track.style.background = `linear-gradient(90deg, rgba(255,255,255,0.6) ${pc}%, rgba(255,255,255,0.1) ${pc}%)`;
              big.textContent = v + unit;
            };
            const send = () => hass.callService(domain, 'set_value', {entity_id: id, value: v});
            const at = (e) => { const r = track.getBoundingClientRect();
              v = snap(lo + Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (hi - lo)); render(); };
            let drag = false;
            track.addEventListener('pointerdown', (e) => { drag = true; try { track.setPointerCapture(e.pointerId); } catch (err) {} at(e); });
            track.addEventListener('pointermove', (e) => { if (drag) at(e); });
            track.addEventListener('pointerup', (e) => { if (!drag) return; drag = false; at(e); send(); });
            track.addEventListener('pointercancel', () => { drag = false; });
            minus.addEventListener('click', () => { v = snap(v - st); render(); send(); });
            plus.addEventListener('click', () => { v = snap(v + st); render(); send(); });
            onKey = (e) => { if (e.key === 'Escape') close(); };
            document.addEventListener('keydown', onKey);
            render();
          }
          document.body.appendChild(ov);
        ]]]

  # Slider for a setting (input_number / number / input_datetime with time only), drawn like
  # fusion_slider: drag across the tile, the fill is the value. Settings have no use for the
  # history of more-info, so tap and hold do nothing. Range and step come from the entity's own
  # min/max/step; times go from 00:00 to 23:45 in steps of 15 min.
  # Double width like the lights: add `view_layout: {grid-column: span 2}` where used.
  fusion_range:
    template: fusion_tile
    variables:
      iw: 61
    tap_action:
      action: none
    hold_action:
      action: none
    state_display: |
      [[[
        if (!entity) return '';
        const s = entity.state;
        if (entity.entity_id.startsWith('input_datetime.')) return s.slice(0, 5);
        const n = Number(s), u = entity.attributes.unit_of_measurement;
        const v = isNaN(n) ? s : String(Math.round(n * 100) / 100);
        return u ? `${v} ${u}` : v;
      ]]]
    custom_fields:
      # Same pointer handling as fusion_slider (see the notes there). The range of this entity
      # is baked into the handlers when the card renders.
      slider: |
        [[[
          if (!entity) return '';
          const id = entity.entity_id, domain = id.split('.')[0], t = domain === 'input_datetime';
          const a = entity.attributes;
          // variables.min / variables.max narrow the entity's own range (e.g. page zoom 50-200).
          const lo = t ? 0 : Number(variables.min ?? a.min), hi = t ? 1425 : Number(variables.max ?? a.max), st = t ? 15 : (Number(a.step) || 1);
          const unit = t ? '' : (a.unit_of_measurement ? ' ' + a.unit_of_measurement : '');
          const fmt = t
            ? `const f=String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');`
            : `const f=v+'${unit}';`;
          const calc = `const r=this.getBoundingClientRect();` +
            `const q=Math.max(0,Math.min(1,(event.clientX-r.left)/r.width));` +
            `let v=${lo}+Math.round(q*(${hi}-${lo})/${st})*${st};` +
            `v=Math.round(Math.max(${lo},Math.min(${hi},v))*1000)/1000;` +
            `const pc=(v-${lo})/(${hi}-${lo})*100;` + fmt;
          const paint = `const root=this.getRootNode();const c=root.querySelector('ha-card');` +
            `const at='calc(${variables.iw}px + (100% - ${variables.iw}px) * '+pc+' / 100)';` +
            `c.style.background='linear-gradient(90deg, rgba(255,255,255,0.22) '+at+', rgba(0,0,0,0.15) '+at+')';` +
            `const s=root.querySelector('#state');if(s)s.setAttribute('data-pv',f);`;
          const call = t
            ? `'input_datetime','set_datetime',{entity_id:'${id}',time:f+':00'}`
            : `'${domain}','set_value',{entity_id:'${id}',value:v}`;
          const send = `const h=this.getRootNode().host;` +
            `(h.hass||document.querySelector('home-assistant').hass).callService(${call});`;
          const now = t
            ? `const p0=String(x.state).split(':');const p=((p0[0]*60+ +p0[1])-${lo})/(${hi}-${lo})*100;`
            : `const p=(Number(x.state)-${lo})/(${hi}-${lo})*100;`;
          const sync = `const root=tr.getRootNode();const s=root.querySelector('#state');if(s)s.removeAttribute('data-pv');` +
            `const x=(root.host.hass||document.querySelector('home-assistant').hass).states['${id}'];if(!x)return;` + now +
            `const at='calc(${variables.iw}px + (100% - ${variables.iw}px) * '+Math.max(0,Math.min(100,p))+' / 100)';` +
            `root.querySelector('ha-card').style.background='linear-gradient(90deg, rgba(255,255,255,0.22) '+at+', rgba(0,0,0,0.15) '+at+')';`;
          const down = `this._d=1;clearTimeout(this._t);const c0=this.getRootNode().querySelector('ha-card');` +
            `this._bg=c0.style.background;` +
            `try{this.setPointerCapture(event.pointerId)}catch(e){}` + calc + paint;
          const move = `if(!this._d)return;` + calc + paint;
          const up = `if(!this._d)return;this._d=0;event.stopPropagation();` + calc + paint + send +
            `const tr=this;this._t=setTimeout(()=>{` + sync + `},5000);`;
          const cancel = `if(!this._d)return;this._d=0;const c=this.getRootNode().querySelector('ha-card');` +
            `c.style.background=this._bg;const s=this.getRootNode().querySelector('#state');if(s)s.removeAttribute('data-pv');`;
          const stop = 'event.stopPropagation()';
          return `<div class="track" onpointerdown="event.stopPropagation();${down}" onpointermove="${move}" ` +
            `onpointerup="${up}" onpointercancel="${cancel}" onmousedown="${stop}" onmouseup="${stop}" ` +
            `ontouchstart="${stop}" ontouchend="${stop}" onclick="${stop}" ondblclick="${stop}"></div>`;
        ]]]
    styles:
      card:
        - width: 393.6px
        - background: |
            [[[
              if (!entity) return 'rgba(0, 0, 0, 0.15)';
              const t = entity.entity_id.startsWith('input_datetime.'), a = entity.attributes;
              const lo = t ? 0 : Number(variables.min ?? a.min), hi = t ? 1425 : Number(variables.max ?? a.max);
              let cur = Number(entity.state);
              if (t) { const p = String(entity.state).split(':'); cur = p[0] * 60 + +p[1]; }
              const pct = Math.max(0, Math.min(100, (cur - lo) / (hi - lo) * 100)) || 0;
              const at = `calc(${variables.iw}px + (100% - ${variables.iw}px) * ${pct} / 100)`;
              return `linear-gradient(90deg, rgba(255, 255, 255, 0.22) ${at}, rgba(0, 0, 0, 0.15) ${at})`;
            ]]]
      img_cell:
        - background: rgb(131, 129, 124)
      custom_fields:
        slider:
          - position: absolute
          - top: 0
          - bottom: 0
          - left: '[[[ return `${variables.iw}px`; ]]]'
          - right: 0
          - pointer-events: auto
    extra_styles: |
      #state[data-pv] { position: relative; visibility: hidden; }
      #state[data-pv]::after { content: attr(data-pv); visibility: visible; position: absolute; inset: 0; }
      .track {
        width: 100%;
        height: 100%;
        cursor: pointer;
        pointer-events: auto;
        touch-action: pan-y;
        -webkit-tap-highlight-color: transparent;
      }

  # Tile for a boot-time timestamp sensor: shows "3d 4h" / "5h 12m".
  fusion_uptime:
    template: fusion_tile
    state_display: |
      [[[
        const t = Date.now() - new Date(entity.state).getTime();
        if (isNaN(t)) return entity.state;
        const d = Math.floor(t / 864e5), h = Math.floor(t % 864e5 / 36e5), m = Math.floor(t % 36e5 / 6e4);
        return d ? `${d}d ${h}h` : `${h}h ${m}m`;
      ]]]

  # Tile for a timestamp sensor shown as a clock time ("06:12").
  fusion_time:
    template: fusion_tile
    state_display: |
      [[[
        const d = new Date(entity.state);
        return isNaN(d) ? entity.state : d.toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
      ]]]

  # Stopwatch engine. Runs in the browser (window.__sw), saved in localStorage
  # so it keeps counting across tabs and reloads. Any card using this template
  # gets its .swt (time; add "fine" for tenths), .swp (play/pause icon) and
  # .swlaps (lap list) elements kept up to date.
  sw_engine:
    custom_fields:
      eng: |
        [[[
          const W = window;
          if (!W.__sw) {
            let saved = {};
            try { saved = JSON.parse(localStorage.getItem('kioskStopwatch') || '{}'); } catch (e) {}
            const p = n => String(n).padStart(2, '0');
            W.__sw = {
              start: saved.start || null,
              acc: saved.acc || 0,
              laps: saved.laps || [],
              v: 0,
              cards: new Set(),
              ms() { return this.acc + (this.start ? Date.now() - this.start : 0); },
              fmt(ms, fine) {
                const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
                const base = h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
                return fine ? `${base}.${Math.floor(ms % 1000 / 100)}` : base;
              },
              save() {
                this.v++;
                try { localStorage.setItem('kioskStopwatch', JSON.stringify({start: this.start, acc: this.acc, laps: this.laps})); } catch (e) {}
                this.paint();
              },
              toggle() {
                if (this.start) { this.acc += Date.now() - this.start; this.start = null; }
                else this.start = Date.now();
                this.save();
              },
              lap() { if (this.ms() > 0) { this.laps.unshift(this.ms()); this.laps = this.laps.slice(0, 20); this.save(); } },
              reset() { this.start = null; this.acc = 0; this.laps = []; this.save(); },
              lapsHtml() {
                return this.laps.slice(0, 6).map((ms, i) =>
                  `<div class="lap"><span>Lap ${this.laps.length - i}</span><span>${this.fmt(ms, true)}</span></div>`).join('');
              },
              paint() {
                const ms = this.ms();
                for (const c of this.cards) {
                  if (!c.isConnected) { this.cards.delete(c); continue; }
                  const r = c.shadowRoot;
                  if (!r) continue;
                  r.querySelectorAll('.swt').forEach(t => { t.textContent = this.fmt(ms, t.classList.contains('fine')); });
                  r.querySelectorAll('.swp ha-icon').forEach(i => i.setAttribute('icon', this.start ? 'mdi:pause' : 'mdi:play'));
                  const l = r.querySelector('.swlaps');
                  if (l && l.dataset.v !== String(this.v)) { l.dataset.v = String(this.v); l.innerHTML = this.lapsHtml(); }
                }
              },
            };
            setInterval(() => W.__sw.paint(), 100);
          }
          W.__sw.cards.add(this);
          return '';
        ]]]
    styles:
      custom_fields:
        eng:
          - display: none

  # Section title ("Room", "Me", ...).
  fusion_title:
    show_icon: false
    show_state: false
    tap_action:
      action: none
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: 0
        - margin: 0 0 6.4px
        - font-family: '"Inter Variable", system-ui'
      name:
        - justify-self: start
        - font-size: 28.8px
        - font-weight: 600
        - line-height: 35px
        - color: rgba(255, 255, 255, 0.8)

  # Shared page navigation for the single-view kiosk (see build_dashboard.py).
  # Pages are shown/hidden from the URL hash (#overview, #hub, ...), so the
  # sidebar and the tab bar are rendered once and never redrawn on tab switch.
  kiosk_nav:
    # A variable (not a custom field): variables are evaluated before the
    # custom fields that use window.__kioskNav.
    variables:
      nav_ready: |
        [[[
          if (!window.__kioskNav) {
            const nav = window.__kioskNav = {
              pages: new Set(),
              tabs: new Set(),
              current() {
                const h = decodeURIComponent(location.hash.slice(1));
                return [...nav.pages].some(p => p._page === h) ? h : 'overview';
              },
              go(page) { if (nav.current() !== page) location.hash = page; },
              apply() {
                const cur = nav.current();
                for (const p of nav.pages) {
                  if (!p.isConnected) { nav.pages.delete(p); continue; }
                  p.style.display = p._page === cur ? '' : 'none';
                }
                for (const t of nav.tabs) {
                  if (!t.isConnected) { nav.tabs.delete(t); continue; }
                  const r = t.shadowRoot;
                  if (!r) continue;
                  r.querySelectorAll('.tab').forEach(s => s.classList.toggle('active', s.dataset.p === cur));
                  const bar = r.querySelector('.tab') && r.querySelector('.tab').parentElement;
                  if (bar) bar.__revealed = false;
                }
                window.scrollTo(0, 0);
              },
            };
            window.addEventListener('hashchange', () => nav.apply());
          }
          return true;
        ]]]

  # Invisible marker placed first in every page by build_dashboard.py: it finds
  # the page's layout-card and registers it with the hash navigation.
  fusion_page:
    template: kiosk_nav
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    custom_fields:
      reg: |
        [[[
          if (!variables.nav_ready) return '';
          const nav = window.__kioskNav, marker = this, page = variables.page;
          const attach = (tries) => {
            let n = marker, box = null;
            while (n) {
              if (n !== marker && n.tagName === 'LAYOUT-CARD') { box = n; break; }
              n = n.parentNode instanceof ShadowRoot ? n.parentNode.host : n.parentNode;
            }
            if (!box) { if (tries > 0) setTimeout(() => attach(tries - 1), 50); return; }
            box._page = page;
            nav.pages.add(box);
            box.style.display = nav.current() === page ? '' : 'none';
          };
          attach(100);
          return '';
        ]]]
    styles:
      card:
        - display: none

  # Whole tab bar. To add a tab: add [path, title] here and a view with that
  # path below (its first card `template: fusion_tabs`).
  fusion_tabs:
    template: kiosk_nav
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    variables:
      tabs:
        - [overview, Overview]
        - [hub, HUB]
        - [network, Network]
        - [weather, Weather]
        - [server, Server]
        - [energy, Energy]
        - [automations, Automations]
    custom_fields:
      tabs: |
        [[[
          if (!variables.nav_ready) return '';
          const nav = window.__kioskNav;
          nav.tabs.add(this);
          const cur = nav.current();
          const tabsHtml = variables.tabs.map(([path, title]) => {
            // Touch: button-card cancels the synthetic click, so navigate on
            // pointerup, unless the finger moved (scroll).
            const down = `this._x=event.clientX;this._y=event.clientY;`;
            const up = `event.stopPropagation();` +
              `if(Math.abs(event.clientX-(this._x??event.clientX))<15&&Math.abs(event.clientY-(this._y??event.clientY))<15)` +
              `{window.__kioskNav.go('${path}')}`;
            return `<span class="${path === cur ? 'tab active' : 'tab'}" data-p="${path}" ` +
              `onpointerdown="${down}" onpointerup="${up}">${title}</span>`;
          }).join('');
          // More tabs than fit: the bar scrolls sideways. A small global check
          // (every 300 ms) scrolls a cut-off active tab into view.
          if (!window.__tabsReveal) {
            window.__tabsReveal = new Set();
            setInterval(() => {
              for (const c of window.__tabsReveal) {
                if (!c.isConnected) { window.__tabsReveal.delete(c); continue; }
                const act = c.shadowRoot && c.shadowRoot.querySelector('.tab.active');
                const bar = act && act.parentElement;
                if (!bar || bar.__revealed || !act.getBoundingClientRect().width) continue;
                if (bar.scrollWidth > bar.clientWidth) {
                  const left = act.getBoundingClientRect().left - bar.getBoundingClientRect().left;
                  const over = act.getBoundingClientRect().right - bar.getBoundingClientRect().right;
                  if (over > 0) bar.scrollLeft += over + 22;
                  else if (left < 0) bar.scrollLeft += left - 22;
                }
                bar.__revealed = true;
              }
            }, 300);
          }
          window.__tabsReveal.add(this);
          return tabsHtml;
        ]]]
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - border-radius: 0
        - padding: 0
        - margin: 0 0 30px
        - overflow: visible
        - font-family: '"Inter Variable", system-ui'
      grid:
        - grid-template-areas: '"tabs"'
        - grid-template-columns: minmax(0, 1fr)
      custom_fields:
        tabs:
          - justify-self: stretch
          - min-width: 0
          - display: flex
          - gap: 22px
          - pointer-events: auto
          # Sideways scroll (no scrollbar) when the tabs don't fit; the vertical
          # padding/margin pair keeps the enlarged touch area inside the scroller.
          - overflow-x: auto
          - overflow-y: hidden
          - scrollbar-width: none
          - padding: 0 11px
          - margin: -14px -11px -10px
    extra_styles: |
      /* Bigger touch target (padding) cancelled by negative margins, so the
         layout and the 2px underline stay exactly where they were. */
      .tab {
        position: relative;
        pointer-events: auto;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        flex: 0 0 auto;
        padding: 14px 11px 16px;
        margin: 0 -11px;
        font-size: 22px;
        font-weight: 700;
        line-height: 26px;
        color: rgba(255, 255, 255, 0.4);
      }
      #tabs::-webkit-scrollbar, [id="tabs"]::-webkit-scrollbar { display: none; }
      .tab.active { color: rgb(255, 255, 255); }
      .tab.active::after {
        content: "";
        position: absolute;
        left: 11px;
        right: 11px;
        bottom: 10px;
        height: 2px;
        background: rgb(255, 255, 255);
      }

  # Section title for every section after the first one in a column.
  # Haze, the desktop music player (MQTT entities, one device per PC): the cover fills the
  # card and fades to dark at the bottom, where title, artist and the controls sit.
  # Which Haze it shows comes from input_select.kiosk_haze (entity prefix, e.g. haze_pc);
  # the three dots at the top right open group.kiosk_media: a dialog with that dropdown and
  # two sliders for the size (input_number.kiosk_media_ancho × kiosk_media_alto). Entity ids are built from it, so
  # triggers_update can't list them: "all" re-renders on any change (cheap, 3 templates).
  # Folder opens window.__hazeList: a dialog with the folder dropdown (select.*_reproducir_carpeta)
  # and the songs of the queue (sensor.*_cola, sent by Haze); tapping a song jumps to it.
  # Size in grid tiles (192 x 96.3 px, 9.6 px gap): the card spans that many columns.
  fusion_media:
    entity: input_select.kiosk_haze
    show_name: false
    show_state: false
    show_icon: false
    tap_action: { action: none }
    hold_action: { action: none }
    triggers_update: all
    variables:
      size: |
        [[[
          const n = (id) => Math.max(2, Math.round(Number(states[`input_number.kiosk_media_${id}`]?.state)) || 2);
          return [n('ancho'), n('alto')];
        ]]]
    custom_fields:
      bg: |
        [[[
          const p = entity && entity.state;
          const st = states[`sensor.${p}_estado`];
          const img = states[`image.${p}_caratula`];
          const on = st && ['playing', 'paused'].includes(st.state);
          const pic = on && img && img.state !== 'unavailable' && img.attributes.entity_picture;
          // La URL del proxy no cambia con la tapa: el estado (fecha de la ultima tapa) evita que quede la vieja en cache.
          const src = pic && `${pic}&v=${encodeURIComponent(img.state)}`;
          return pic ? `<div class="pic" style="background-image:url('${src}')"></div>` : `<ha-icon icon="mdi:music"></ha-icon>`;
        ]]]
      info: |
        [[[
          const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
          const st = entity && states[`sensor.${entity.state}_estado`];
          if (!st || st.state === 'unavailable') return `<div class="t">PC off</div><div class="s">Haze is offline</div>`;
          const a = st.attributes;
          if (!a.title) return `<div class="t">Nothing playing</div><div class="s">Haze</div>`;
          return `<div class="t">${esc(a.title)}</div><div class="s">${esc(a.artist || a.context)}</div>`;
        ]]]
      dev: |
        [[[
          const stop = 'event.stopPropagation()';
          const open = `this.dispatchEvent(new CustomEvent('hass-more-info',{bubbles:true,composed:true,detail:{entityId:'group.kiosk_media'}}))`;
          return `<div class="d" onpointerup="${stop};${open}" onpointerdown="${stop}" onclick="${stop}" ` +
            `onmousedown="${stop}" ontouchstart="${stop}"><ha-icon icon="mdi:dots-vertical"></ha-icon></div>`;
        ]]]
      ctl: |
        [[[
          // No llamarla `hass`: button-card ya define esa variable y redeclararla rompe la plantilla.
          const callHass = `(this.getRootNode().host.hass||document.querySelector('home-assistant').hass)`;
          // Song list dialog. Lives in document.body (outside the card, so it isn't clipped)
          // and repaints itself from hass.states while it's open.
          if (!window.__hazeList) {
            const H = () => document.querySelector('home-assistant').hass;
            const mk = (tag, cls, text) => {
              const e = document.createElement(tag);
              if (cls) e.className = cls;
              if (text != null) e.textContent = text;
              return e;
            };
            const css = `
              .hl-bg { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
                background: rgba(0, 0, 0, 0.55); font-family: "Inter Variable", system-ui; color: rgb(255, 255, 255); }
              .hl-box { width: min(560px, calc(100vw - 32px)); height: min(600px, calc(100vh - 48px));
                display: flex; flex-direction: column; background: #1d2328; border-radius: 16px; overflow: hidden;
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); }
              .hl-head { display: flex; align-items: center; gap: 8px; padding: 12px 8px 12px 16px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
              .hl-head ha-icon { color: rgba(255, 255, 255, 0.6); --mdc-icon-size: 22px; }
              .hl-sel { flex: 1; min-width: 0; height: 44px; padding: 0 12px; border: none; border-radius: 10.4px;
                background: rgba(255, 255, 255, 0.07); color: inherit; font: 500 16px "Inter Variable", system-ui; outline: none; }
              .hl-sel option { background: #1d2328; }
              .hl-x { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; cursor: pointer; }
              .hl-x ha-icon { color: rgba(255, 255, 255, 0.85); }
              .hl-songs { position: relative; flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 6px 0; }
              .hl-row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; cursor: pointer; }
              .hl-row:active { background: rgba(255, 255, 255, 0.06); }
              .hl-n { width: 28px; flex: none; text-align: right; font-size: 13px; color: rgba(255, 255, 255, 0.4);
                font-variant-numeric: tabular-nums; }
              .hl-n ha-icon { --mdc-icon-size: 20px; }
              .hl-tx { min-width: 0; }
              .hl-t, .hl-a { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
              .hl-t { font-size: 15px; font-weight: 500; line-height: 19px; }
              .hl-a { font-size: 13px; line-height: 17px; color: rgba(255, 255, 255, 0.55); }
              .hl-row.cur .hl-t, .hl-row.cur .hl-n { color: rgb(242, 196, 107); }
              .hl-msg { padding: 32px 16px; text-align: center; color: rgba(255, 255, 255, 0.5); font-size: 14px; }`;
            const L = window.__hazeList = {
              el: null, p: null, sig: '', optSig: '', t: null,
              open(p) {
                this.close();
                this.p = p;
                const el = this.el = mk('div', 'hl-bg');
                el.innerHTML = `<style>${css}</style><div class="hl-box"><div class="hl-head">` +
                  `<ha-icon icon="mdi:folder-music-outline"></ha-icon><select class="hl-sel"></select>` +
                  `<div class="hl-x"><ha-icon icon="mdi:close"></ha-icon></div></div><div class="hl-songs"></div></div>`;
                // The folder button opens this on pointerup; the browser's click comes right after at the
                // same spot and would hit the song under the finger. Swallow clicks for a moment.
                const openedAt = Date.now();
                el.addEventListener('click', (e) => {
                  if (Date.now() - openedAt < 500) { e.stopImmediatePropagation(); e.preventDefault(); }
                }, true);
                el.addEventListener('click', (e) => { if (e.target === el) this.close(); });
                el.querySelector('.hl-x').addEventListener('click', () => this.close());
                el.querySelector('.hl-sel').addEventListener('change', (e) =>
                  H().callService('select', 'select_option', { entity_id: `select.${this.p}_reproducir_carpeta`, option: e.target.value }));
                document.body.appendChild(el);
                this.paint(true);
                this.t = setInterval(() => this.paint(false), 500);
              },
              close() {
                clearInterval(this.t);
                if (this.el) this.el.remove();
                this.el = null; this.sig = ''; this.optSig = '';
              },
              paint(scroll) {
                if (!this.el) return;
                if (!this.el.isConnected) return this.close();
                const st = H().states;
                const sel = st[`select.${this.p}_reproducir_carpeta`];
                const q = st[`sensor.${this.p}_cola`];
                const qa = (q && q.attributes) || {};
                // Folder dropdown: the folder that is playing, or the last one picked.
                const opts = (sel && sel.attributes.options) || [];
                const cur = opts.includes(qa.context) ? qa.context : (sel && opts.includes(sel.state) ? sel.state : '');
                const box = this.el.querySelector('.hl-sel');
                const optSig = JSON.stringify([opts, cur]);
                if (optSig !== this.optSig && document.activeElement !== box) {
                  this.optSig = optSig;
                  box.replaceChildren();
                  if (!cur) { const o = mk('option', '', 'Choose a folder'); o.value = ''; o.disabled = true; box.append(o); }
                  for (const n of opts) { const o = mk('option', '', n); o.value = n; box.append(o); }
                  box.value = cur;
                }
                // Songs: only redrawn when the queue changes.
                const sig = q ? `${q.state}|${q.last_updated}` : 'none';
                if (sig === this.sig) return;
                this.sig = sig;
                const list = this.el.querySelector('.hl-songs');
                const songs = Array.isArray(qa.songs) ? qa.songs : [];
                if (!q) return list.replaceChildren(mk('div', 'hl-msg', 'Update Haze to see the song list'));
                if (q.state === 'unavailable') return list.replaceChildren(mk('div', 'hl-msg', 'Haze is offline'));
                if (!songs.length) return list.replaceChildren(mk('div', 'hl-msg', 'No songs in the queue'));
                const rows = songs.map((s, i) => {
                  const row = mk('div', i === qa.current ? 'hl-row cur' : 'hl-row');
                  const n = mk('div', 'hl-n');
                  if (i === qa.current) n.innerHTML = '<ha-icon icon="mdi:volume-high"></ha-icon>';
                  else n.textContent = String((qa.offset || 0) + i + 1);
                  const tx = mk('div', 'hl-tx');
                  tx.append(mk('div', 'hl-t', s.t || 'Unknown'));
                  if (s.a) tx.append(mk('div', 'hl-a', s.a));
                  row.append(n, tx);
                  row.addEventListener('click', () =>
                    H().callService('mqtt', 'publish', { topic: qa.jump_topic, payload: String(s.u) }));
                  return row;
                });
                if (qa.total > songs.length) rows.push(mk('div', 'hl-msg', `${songs.length} of ${qa.total} songs`));
                list.replaceChildren(...rows);
                if (scroll && rows[qa.current]) list.scrollTop = rows[qa.current].offsetTop - list.clientHeight / 2 + 26;
              },
            };
            window.addEventListener('hashchange', () => L.close());
          }
          const stop = 'event.stopPropagation()';
          const btn = (action, icon, cls) =>
            `<div class="b ${cls}" onpointerup="${stop};${action}" onpointerdown="${stop}" onclick="${stop}" ` +
            `onmousedown="${stop}" ontouchstart="${stop}"><ha-icon icon="${icon}"></ha-icon></div>`;
          const press = (id) => `${callHass}.callService('button','press',{entity_id:'${id}'})`;
          const p = entity && entity.state;
          const st = states[`sensor.${p}_estado`];
          const shuffle = states[`switch.${p}_aleatorio`];
          const shuffleOn = shuffle && shuffle.state === 'on';
          const folder = `window.__hazeList.open('${p}')`;
          const playing = st && st.state === 'playing';
          return btn(`${callHass}.callService('switch','toggle',{entity_id:'switch.${p}_aleatorio'})`, 'mdi:shuffle-variant', shuffleOn ? 'on' : '') +
            btn(press(`button.${p}_anterior`), 'mdi:skip-previous', '') +
            btn(press(`button.${p}_play_pausa`), playing ? 'mdi:pause' : 'mdi:play', 'main') +
            btn(press(`button.${p}_siguiente`), 'mdi:skip-next', '') +
            btn(folder, 'mdi:folder-music-outline', '');
        ]]]
    styles:
      card:
        - width: '[[[ return `${variables.size[0] * 192 + (variables.size[0] - 1) * 9.6}px`; ]]]'
        - height: '[[[ return `${variables.size[1] * 96.3 + (variables.size[1] - 1) * 9.6}px`; ]]]'
        - padding: 0
        - border: none
        - border-radius: 10.4px
        - box-shadow: none
        - overflow: hidden
        - background: rgba(0, 0, 0, 0.15)
        - font-family: '"Inter Variable", system-ui'
        - color: rgb(255, 255, 255)
      grid:
        - grid-template-areas: '"bg"'
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr
      custom_fields:
        bg:
          - position: absolute
          - inset: 0
          - display: grid
          - place-items: center
          - color: rgba(255, 255, 255, 0.25)
        info:
          - position: absolute
          - left: 16px
          - right: 16px
          - bottom: 62px
          - text-align: left
        ctl:
          - position: absolute
          - left: 0
          - right: 0
          - bottom: 10px
          - display: flex
          - justify-content: center
          - align-items: center
          - gap: 18px
          - pointer-events: auto
        dev:
          - position: absolute
          - top: 6px
          - right: 4px
          - z-index: 2
          - pointer-events: auto
    # The grid cell follows the size: !important beats the inline span that layout-card sets.
    extra_styles: |
      [[[ return `:host { grid-column: span ${variables.size[0]} !important; }
      .d {
        width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%;
        cursor: pointer; pointer-events: auto; color: rgba(255, 255, 255, 0.85); filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6));
      }
      .d ha-icon { --mdc-icon-size: 22px; }
      .d:active { transform: scale(0.92); }
      #bg .pic { position: absolute; inset: 0; background-size: cover; background-position: center; }
      #bg::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(10, 13, 16, 0) 0%, rgba(10, 13, 16, 0.35) 40%, rgba(10, 13, 16, 0.92) 78%, rgba(10, 13, 16, 0.97) 100%);
      }
      #bg ha-icon { --mdc-icon-size: 48px; margin-bottom: 70px; }
      .t, .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .t { font-size: 16px; font-weight: 600; line-height: 20px; }
      .s { font-size: 14px; line-height: 18px; color: rgba(255, 255, 255, 0.7); }
      .b {
        width: 40px; height: 40px; display: grid; place-items: center;
        cursor: pointer; pointer-events: auto; color: rgba(255, 255, 255, 0.85);
        border-radius: 50%; transition: transform 0.1s;
      }
      .b ha-icon { --mdc-icon-size: 24px; }
      .b.on { color: rgb(242, 196, 107); }
      .b.main { width: 46px; height: 46px; background: rgba(255, 255, 255, 0.92); color: rgb(30, 33, 36); }
      .b.main ha-icon { --mdc-icon-size: 28px; }
      .b:active { transform: scale(0.92); }` ]]]

  fusion_title_next:
    template: fusion_title
    styles:
      card:
        - margin: 24px 0 6.4px

# ---- Shared building blocks (YAML anchors, expanded on save) ----

x-sidebar: &sidebar
  type: vertical-stack
  view_layout:
    grid-area: side
  card_mod:
    style: |
      :host {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 344px;
        height: 100vh;
        overflow: hidden;
        z-index: 1;
        box-sizing: border-box;
        padding: 0 22.4px 22.4px;
        background: rgba(0, 0, 0, 0.06);
        border-right: 1px solid rgba(115, 115, 115, 0.25);
        font-family: "Inter Variable", system-ui;
      }
  cards:
    # Clock
    - type: custom:button-card
      show_icon: false
      show_name: false
      show_state: false
      show_label: true
      triggers_update: all
      label: |
        [[[ const d = new Date(); return d.toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'}); ]]]
      tap_action:
        action: none
      styles:
        card:
          - background: none
          - border: none
          - box-shadow: none
          - padding: 16px 0 0 9.6px
          - margin-left: -1.6px
          - font-family: '"Inter Variable", system-ui'
        label:
          - justify-self: start
          - font-size: 54.4px
          - font-weight: 500
          - line-height: 64px
          - color: rgba(255, 255, 255, 0.8)
    # Date
    - type: custom:button-card
      show_icon: false
      show_name: true
      show_state: false
      triggers_update: all
      name: |
        [[[ return new Date().toLocaleDateString('en-US', {weekday: 'long', month: 'long', day: 'numeric'}); ]]]
      tap_action:
        action: none
      styles:
        card:
          - background: none
          - border: none
          - box-shadow: none
          - padding: 2px 0 0 9.6px
          - font-family: '"Inter Variable", system-ui'
        name:
          - justify-self: start
          - font-size: 16px
          - line-height: 19px
          - color: rgba(255, 255, 255, 0.7)
    # Now: condition, temperature and details (same as the desktop Home's sidebar).
    - type: custom:button-card
      entity: weather.clima
      show_icon: false
      show_name: false
      show_state: false
      tap_action:
        action: more-info
      custom_fields:
        now: |
          [[[
            const a = entity.attributes;
            const names = {'clear-night': 'Clear', cloudy: 'Cloudy', fog: 'Fog', hail: 'Hail', lightning: 'Storm',
              'lightning-rainy': 'Storm', partlycloudy: 'Partly cloudy', pouring: 'Pouring', rainy: 'Rain',
              snowy: 'Snow', 'snowy-rainy': 'Sleet', sunny: 'Sunny', windy: 'Windy', 'windy-variant': 'Windy', exceptional: 'Exceptional'};
            const day = (states['sun.sun'] || {}).state !== 'below_horizon';
            const icon = `/local/kiosk/meteocons/${entity.state}-${day ? 'day' : 'night'}.svg`;
            const r = (v) => v === undefined || v === null ? '-' : Math.round(v);
            return `<div class="top"><img src="${icon}"><div><div class="t">${r(a.temperature)}°</div>` +
              `<div class="c">${names[entity.state] || entity.state}</div></div></div>` +
              `<div class="det"><span><ha-icon icon="mdi:thermometer-lines"></ha-icon>Feels ${r(a.apparent_temperature)}°</span>` +
              `<span><ha-icon icon="mdi:water-percent"></ha-icon>${r(a.humidity)} %</span>` +
              `<span><ha-icon icon="mdi:weather-windy"></ha-icon>${r(a.wind_speed)} km/h</span></div>`;
          ]]]
      styles:
        card:
          - background: none
          - border: none
          - box-shadow: none
          - padding: 14px 9.6px 0
          - font-family: '"Inter Variable", system-ui'
          - color: rgba(255, 255, 255, 0.85)
        grid:
          - grid-template-areas: '"now"'
        custom_fields:
          now:
            - justify-self: stretch
      extra_styles: |
        ha-card { overflow: visible !important; }
        .top { display: flex; align-items: center; gap: 8px; }
        .top img { width: 84px; height: 84px; margin: -10px -4px -10px -10px; }
        .t { font-size: 46px; font-weight: 500; line-height: 52px; text-align: left; }
        .c { font-size: 16px; color: rgba(255, 255, 255, 0.7); text-align: left; }
        .det { display: flex; justify-content: space-between; margin-top: 12px; font-size: 14.5px; color: rgba(255, 255, 255, 0.7); }
        .det span { display: flex; align-items: center; gap: 4px; }
        .det ha-icon { --mdc-icon-size: 18px; width: 18px; height: 18px; display: flex; color: rgba(255, 255, 255, 0.5); }
    # Next hours (every 2 h) between two lines, then the next 6 days in a row.
    # Open-Meteo lists from packages/clima.yaml, ha-fusion's Meteocons icons.
    - type: custom:button-card
      entity: sensor.clima_pronostico_horario
      triggers_update: [sensor.clima_pronostico_diario]
      show_icon: false
      show_name: false
      show_state: false
      tap_action:
        action: more-info
        entity: weather.clima
      custom_fields:
        forecast: |
          [[[
            const cond = {0: 'sunny', 1: 'sunny', 2: 'partlycloudy', 3: 'cloudy', 45: 'fog', 48: 'fog',
              51: 'rainy', 53: 'rainy', 55: 'rainy', 56: 'snowy-rainy', 57: 'snowy-rainy',
              61: 'rainy', 63: 'rainy', 65: 'pouring', 66: 'snowy-rainy', 67: 'snowy-rainy',
              71: 'snowy', 73: 'snowy', 75: 'snowy', 77: 'snowy', 80: 'rainy', 81: 'rainy', 82: 'pouring',
              85: 'snowy', 86: 'snowy', 95: 'lightning-rainy', 96: 'lightning-rainy', 99: 'lightning-rainy'};
            const h = entity.attributes, a = (states['sensor.clima_pronostico_diario'] || {}).attributes || {};
            const now = Date.now() - 36e5;
            const hours = (h.time || []).map((t, i) => [t, i]).filter(([t]) => new Date(t).getTime() >= now)
              .filter((_, k) => k % 2 === 0).slice(0, 6);
            const strip = hours.map(([t, i]) => {
              // At night a clear sky is the moon (meteocons' sunny-night is still a sun).
              let c = cond[h.weather_code[i]] || 'cloudy';
              if (!h.is_day[i] && c === 'sunny') c = 'clear-night';
              const p = h.precipitation_probability[i];
              return `<div class="h"><div class="hh">${t.slice(11, 13)}h</div>` +
                `<img src="/local/kiosk/meteocons/${c}${h.is_day[i] ? '-day' : '-night'}.svg">` +
                `<div class="ht">${Math.round(h.temperature_2m[i])}°</div><div class="hp">${p ? p + '%' : ''}</div></div>`;
            }).join('');
            const days = (a.time || []).slice(0, 6);
            const row = days.map((t, i) => {
              const day = new Date(t + 'T12:00:00').toLocaleDateString('en-US', {weekday: 'short'});
              const icon = cond[a.weather_code[i]] || 'cloudy';
              return `<div class="item"><div class="day">${day}</div>` +
                `<img src="/local/kiosk/meteocons/${icon}-day.svg">` +
                `<div class="temp">${Math.round(a.temperature_2m_max[i])}°C</div></div>`;
            }).join('');
            return `<div class="strip">${strip}</div><div class="row">${row}</div>`;
          ]]]
      styles:
        card:
          - background: none
          - border: none
          - box-shadow: none
          - padding: 14px 0 0
          - font-family: '"Inter Variable", system-ui'
          - color: rgba(255, 255, 255, 0.8)
        grid:
          - grid-template-areas: '"forecast"'
        custom_fields:
          forecast:
            - justify-self: stretch
      extra_styles: |
        ha-card { overflow: visible !important; }
        .strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); text-align: center; font-size: 14px;
          padding: 8px 0 6px; border-top: 1px solid rgba(255, 255, 255, 0.12); border-bottom: 1px solid rgba(255, 255, 255, 0.12); }
        .hh { color: rgba(255, 255, 255, 0.55); line-height: 18px; }
        .strip img { width: 38px; height: 38px; margin: 0 auto; display: block; }
        .ht { font-size: 15px; font-weight: 500; line-height: 19px; }
        .hp { height: 15px; font-size: 12px; line-height: 15px; color: rgb(75, 166, 237); }
        .row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding-top: 8px; font-size: 16px; text-align: center; }
        .item { display: flex; flex-direction: column; align-items: center; }
        .day, .temp { height: 23px; line-height: 23px; }
        .row img { width: 48px; height: 48px; margin: -1px 0 1px; }
    # Temperature, last 7 days (hourly statistics), with its range.
    - type: custom:button-card
      entity: sensor.clima_temperatura
      name: Temperature · 7 days
      show_icon: false
      show_state: false
      show_label: true
      label: |
        [[[ return `${entity.state} ${entity.attributes.unit_of_measurement || ''}`; ]]]
      tap_action: { action: more-info }
      custom_fields:
        graph: |
          [[[
            const W = 279, H = 70, card = this, now = Date.now();
            const draw = (rows) => {
              const pts = rows.map((r) => [new Date(r.start).getTime(), r.mean ?? r.state]).filter((p) => p[1] !== null && p[1] !== undefined);
              if (pts.length < 2) return '';
              const mn = Math.min(...pts.map((p) => p[1])), mx = Math.max(...pts.map((p) => p[1]));
              const lo = mn - 1, hi = mx + 1;
              const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
              const x = (t) => 1 + (t - t0) / (t1 - t0 || 1) * (W - 2);
              const y = (v) => (H - 1) - (v - lo) / (hi - lo) * (H - 2);
              const xy = pts.map((p) => [x(p[0]), y(p[1])]);
              const f = (n) => n.toFixed(2);
              let d = `M${f(xy[0][0])},${f(xy[0][1])}`;
              let [x0, y0] = xy[0], [x1, y1] = xy[1];
              d += `L${f((5 * x0 + x1) / 6)},${f((5 * y0 + y1) / 6)}`;
              const bez = (xn, yn) => {
                d += `C${f((2 * x0 + x1) / 3)},${f((2 * y0 + y1) / 3)},${f((x0 + 2 * x1) / 3)},${f((y0 + 2 * y1) / 3)},${f((x0 + 4 * x1 + xn) / 6)},${f((y0 + 4 * y1 + yn) / 6)}`;
                x0 = x1; y0 = y1; x1 = xn; y1 = yn;
              };
              for (let i = 2; i < xy.length; i++) bez(xy[i][0], xy[i][1]);
              bez(x1, y1);
              d += `L${f(x1)},${f(y1)}`;
              const area = `${d}L${f(xy[xy.length - 1][0])},${H - 1}L${f(xy[0][0])},${H - 1}Z`;
              // One tick per midnight
              let ticks = '';
              const m = new Date(t0); m.setHours(24, 0, 0, 0);
              for (let t = m.getTime(); t < t1; t += 864e5) ticks += `<line x1="${f(x(t))}" y1="0" x2="${f(x(t))}" y2="${H}" stroke="rgba(255,255,255,0.07)"/>`;
              return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">` +
                `<defs><linearGradient id="kg" x1="0" y1="0" x2="0" y2="1">` +
                `<stop offset="0%" stop-color="#fff" stop-opacity="0.45"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>` +
                ticks + `<path d="${area}" fill="url(#kg)"/><path d="${d}" fill="none" stroke="#fff" stroke-width="1"/></svg>` +
                `<div class="rg"><span>min ${Math.round(mn)}°</span><span>max ${Math.round(mx)}°</span></div>`;
            };
            const cache = window.__kioskGraphs7 = window.__kioskGraphs7 || {};
            const key = entity.entity_id;
            if (!cache[key] || now - cache[key].t > 600000) {
              cache[key] = { t: now, svg: cache[key] ? cache[key].svg : '' };
              hass.connection.sendMessagePromise({
                type: 'recorder/statistics_during_period',
                start_time: new Date(now - 7 * 864e5).toISOString(),
                end_time: new Date(now).toISOString(),
                statistic_ids: [key],
                period: 'hour',
              }).then((res) => {
                cache[key].svg = draw(res[key] || []);
                const el = card.shadowRoot && card.shadowRoot.getElementById('kgraph');
                if (el) el.innerHTML = cache[key].svg;
              }).catch(() => {});
            }
            return `<div id="kgraph">${cache[key].svg}</div>`;
          ]]]
      styles:
        card:
          - background: none
          - border: none
          - box-shadow: none
          - border-radius: 0
          - padding: 0 9.6px
          - margin-top: 16px
          - font-family: '"Inter Variable", system-ui'
        grid:
          - grid-template-areas: '"n" "l" "graph"'
          - grid-template-rows: 20px 24px auto
        name:
          - justify-self: start
          - font-size: 16px
          - color: rgba(255, 255, 255, 0.8)
        label:
          - justify-self: start
          - font-size: 16px
          - color: rgba(255, 255, 255, 0.8)
        custom_fields:
          graph:
            - margin-top: 6px
            - line-height: 0
      extra_styles: |
        .rg { display: flex; justify-content: space-between; margin-top: 6px; font-size: 13px; line-height: 16px; color: rgba(255, 255, 255, 0.5); }
    # Sun (same as the desktop Home): today's sunrise and sunset, and how long the day is.
    - type: custom:button-card
      entity: sun.sun
      show_icon: false
      show_name: false
      show_state: false
      triggers_update: [sensor.sun_next_rising, sensor.sun_next_setting]
      tap_action: { action: javascript, javascript: "[[[ location.hash = 'sun'; ]]]" }
      custom_fields:
        s: |
          [[[
            const t = (id) => new Date((states[id] || {}).state).getTime();
            const up = entity.state === 'above_horizon';
            const rise = up ? t('sensor.sun_next_rising') - 864e5 : t('sensor.sun_next_rising');
            const set = t('sensor.sun_next_setting');
            const hm = (ms) => isNaN(ms) ? '--:--' : new Date(ms).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
            const len = set - rise, lh = Math.floor(len / 36e5), lm = Math.round(len % 36e5 / 6e4);
            return `<span><ha-icon icon="mdi:weather-sunset-up"></ha-icon>${hm(rise)}</span>` +
              `<span class="m">${isNaN(len) ? '' : `${lh} h ${lm} min of light`}</span>` +
              `<span><ha-icon icon="mdi:weather-sunset-down"></ha-icon>${hm(set)}</span>`;
          ]]]
      styles:
        card:
          - background: none
          - border: none
          - box-shadow: none
          - padding: 10px 9.6px 0
          - margin-top: 14px
          - border-top: 1px solid rgba(255, 255, 255, 0.08)
          - border-radius: 0
          - font-family: '"Inter Variable", system-ui'
        grid:
          - grid-template-areas: '"s"'
        custom_fields:
          s:
            - justify-self: stretch
            - display: flex
            - justify-content: space-between
            - align-items: center
            - font-size: 15px
            - color: rgba(255, 255, 255, 0.8)
      extra_styles: |
        #s span { display: flex; align-items: center; gap: 6px; }
        #s .m { font-size: 13px; color: rgba(255, 255, 255, 0.5); }
        #s ha-icon { --mdc-icon-size: 20px; width: 20px; height: 20px; display: flex; color: rgba(255, 255, 255, 0.55); }

x-layout: &layout
  grid-template-columns: 344px 1fr
  grid-template-rows: auto
  grid-template-areas: '"side main"'
  grid-gap: 0
  margin: 0
  padding: 0
  card_margin: 0px

x-main-layout: &main_layout
  padding: 26px 32px 32px
  margin: 0
  card_margin: 0px
  grid-template-columns: 1fr
  grid-gap: 0

x-tiles-layout: &tiles_layout
  grid-template-columns: repeat(auto-fill, 192px)
  grid-gap: 9.6px
  margin: 0
  padding: 0
  card_margin: 0px

# Two columns on wide screens; one column on the 5" kiosk (1024x576 CSS px at
# TouchKio's 125% zoom), where a half column would fit only one 192px tile.
x-columns-layout: &columns_layout
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
  grid-gap: 24px
  margin: 0
  padding: 0
  card_margin: 0px
  mediaquery:
    "(max-width: 1200px)":
      grid-template-columns: minmax(0, 1fr)

# Any native/HACS card (graphs, gauges, maps...): wraps to as many columns as fit.
x-charts-layout: &charts_layout
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr))
  grid-gap: 9.6px
  margin: 0
  padding: 0
  card_margin: 0px

views:
  - title: Overview
    path: overview
    type: custom:grid-layout
    theme: MRTN Kiosk
    layout: *layout
    cards:
      - *sidebar
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout: *main_layout
        view_layout:
          grid-area: main
        cards:
          - type: custom:button-card
            template: fusion_tabs
            variables:
              active: overview
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout: *columns_layout
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:button-card
                    template: fusion_title
                    name: Room
                  - type: custom:layout-card
                    layout_type: custom:grid-layout
                    layout: *tiles_layout
                    cards:
                      - type: custom:button-card
                        template: fusion_slider
                        entity: light.room
                        name: Lights
                        view_layout:
                          grid-column: span 2
                  # Untitled section: tap Sun or Stopwatch to open its view.
                  - type: custom:layout-card
                    layout_type: custom:grid-layout
                    layout:
                      <<: *tiles_layout
                      margin: 24px 0 0
                    cards:
                      - type: custom:button-card
                        template: fusion_tile
                        entity: sun.sun
                        name: Sun
                        icon: |
                          [[[ return entity.state === 'above_horizon' ? 'mdi:weather-sunny' : 'mdi:weather-night'; ]]]
                        state_display: |
                          [[[ return {above_horizon: 'Above horizon', below_horizon: 'Below horizon'}[entity.state] || entity.state; ]]]
                        tap_action: { action: navigate, navigation_path: sun }
                      - type: custom:button-card
                        template: [fusion_tile, sw_engine]
                        name: Stopwatch
                        icon: mdi:timer-outline
                        show_state: false
                        tap_action:
                          { action: navigate, navigation_path: stopwatch }
                        custom_fields:
                          s: |
                            [[[ return `<span class="swt">${window.__sw ? window.__sw.fmt(window.__sw.ms()) : '00:00'}</span>`; ]]]
                        styles:
                          custom_fields:
                            s:
                              - justify-self: start
                              - align-self: start
                              - padding-right: 11.52px
                              - font-size: 14.8px
                              - line-height: 18px
                              - font-variant-numeric: tabular-nums
                              - color: rgba(255, 255, 255, 0.7)
                  # Media: Haze, the desktop player on the PC (github.com/MartinSchubert04/Haze), over MQTT.
                  - type: custom:button-card
                    template: fusion_title_next
                    name: Media
                  - type: custom:layout-card
                    layout_type: custom:grid-layout
                    layout: *tiles_layout
                    cards:
                      - type: custom:button-card
                        template: fusion_media
                        view_layout:
                          grid-column: span 2
              - type: vertical-stack
                cards:
                  # Untitled: an invisible title (zero-width space) keeps these
                  # tiles level with the ones under "Room".
                  - type: custom:button-card
                    template: fusion_title
                    name: "​"
                  - type: custom:layout-card
                    layout_type: custom:grid-layout
                    layout: *tiles_layout
                    cards:
                      - type: custom:button-card
                        template: fusion_tile
                        entity: device_tracker.a35_martin
                        name: Martin
                        tap_action: { action: navigate, navigation_path: map }
                      - type: custom:button-card
                        template: fusion_tile
                        entity: sensor.ruta_tiempo
                        name: Travel time
                      # Swaps origin and destination (way there / way back).
                      - type: custom:button-card
                        template: fusion_tile
                        entity: input_text.ruta_destino
                        name: Route
                        icon: mdi:swap-horizontal
                        state_display: |
                          [[[
                            const d = entity.state && !['unknown', 'unavailable'].includes(entity.state) ? entity.state.split(',')[0] : '-';
                            return `to ${d}`;
                          ]]]
                        tap_action:
                          action: javascript
                          javascript: |
                            [[[
                              const o = states['input_text.ruta_origen'].state;
                              const d = states['input_text.ruta_destino'].state;
                              hass.callService('input_text', 'set_value', {entity_id: 'input_text.ruta_origen', value: d});
                              hass.callService('input_text', 'set_value', {entity_id: 'input_text.ruta_destino', value: o});
                            ]]]

  - title: HUB
