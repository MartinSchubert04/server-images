services:
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:latest
    networks:
      - home
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 100M

  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    networks:
      - home
    depends_on:
      hacs-installer:
        condition: service_completed_successfully
      ssh-key-init:
        condition: service_completed_successfully
    volumes:
      - homeassistant_data:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    # Docker Desktop ya define host.docker.internal; en Linux hace falta esta línea
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8123:8123"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome:stable
    networks:
      - home
    volumes:
      - esphome_data:/config
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "6052:6052"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  frigate:
    container_name: frigate
    # Apagado por ahora: no arranca con "docker compose up". Para usarlo: docker compose --profile frigate up -d
    profiles: [frigate]
    image: ghcr.io/blakeblackshear/frigate:stable-tensorrt
    networks:
      - home
    restart: unless-stopped
    shm_size: "256mb"
    environment:
      FRIGATE_MQTT_PASSWORD: ${FRIGATE_MQTT_PASSWORD}
    volumes:
      - ./frigate/config:/config
      - ./frigate/media:/media/frigate
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5000:5000"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ----- Voz (Assist): Home Assistant los agrega con la integración Wyoming
  whisper:
    container_name: whisper
    image: lscr.io/linuxserver/faster-whisper:gpu
    networks:
      - home
    environment:
      TZ: ${TZ}
      WHISPER_MODEL: medium-int8
      WHISPER_LANG: es
      WHISPER_BEAM: 5
    volumes:
      - whisper_data:/config
    ports:
      - "10300:10300"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  piper:
    container_name: piper
    image: lscr.io/linuxserver/piper:latest
    networks:
      - home
    environment:
      TZ: ${TZ}
      PIPER_VOICE: es_AR-daniela-high
    volumes:
      - piper_data:/config
    ports:
      - "10200:10200"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  # ----- Home assistant dependency
  hacs-installer:
    container_name: hacs-installer
    image: alpine:latest
    networks:
      - home
    volumes:
      - homeassistant_data:/config
    entrypoint: >
      sh -c "
      apk add --no-cache bash curl unzip &&
      bash -c \"$(curl -fsSL https://get.hacs.xyz)\"
      "
    restart: "no"

  ssh-key-init:
    container_name: ssh-key-init
    image: alpine:latest
    networks:
      - home
    volumes:
      - homeassistant_data:/config
      - ./home-assistant-init/init.sh:/init.sh:ro
      - ./home-assistant-init/configuration.yaml:/init/configuration.yaml:ro
      - ./home-assistant-init/packages:/init/packages:ro
    entrypoint: sh -c "apk add --no-cache openssh-keygen && sh /init.sh"
    restart: "no"

networks:
  home:
    name: home
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1200

volumes:
  esphome_data:
  homeassistant_data:
  whisper_data:
  piper_data: