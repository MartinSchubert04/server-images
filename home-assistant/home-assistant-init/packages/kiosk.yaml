# Automatizaciones del kiosco (MRTN-HUB) y de las luces smart.
#
# Todos los horarios y porcentajes son helpers: se cambian desde la pestaña Automations del kiosco
# (tocando cada valor; los horarios, en el botón de cada sección) o en Ajustes → Dispositivos y
# servicios → Ayudantes. Los helpers no tienen
# "initial" a propósito: así Home Assistant guarda el último valor elegido y no lo pisa al reiniciar.
#
# Las luces se eligen con la etiqueta "Auto lights" (label_id auto_lights): para sumar una luz nueva
# a estas automatizaciones, alcanza con ponerle esa etiqueta en Ajustes → Entidades.

# Horarios, como texto "HH:MM=valor" separados por ";" (los edita el modal del kiosco):
# - kiosk_horarios: desde esa hora, brillo de la pantalla / brillo sin uso. "07:00=60/5;23:00=5/1"
# - luces_horarios: desde esa hora, las luces "Auto lights" van a ese brillo (las prendidas y las que
#   se prendan después); 0 = apagarlas a esa hora y no tocarlas hasta el próximo horario. "22:00=40;00:00=0"
# Cada horario vale hasta el siguiente; el último sigue hasta el primero del otro día.
input_text:
  kiosk_horarios:
    name: "Kiosco: horarios de brillo"
    icon: mdi:clock-outline
    max: 255
  luces_horarios:
    name: "Luces: horarios"
    icon: mdi:lightbulb-auto
    max: 255

input_number:
  kiosk_inactividad_min:
    name: "Kiosco: volver a Overview tras"
    icon: mdi:timer-sand
    min: 5
    max: 60
    step: 1
    unit_of_measurement: "min"
    mode: slider
  # Pantalla sin toques: tras kiosk_apagar_min se apaga (0 = nunca); al tocarla vuelve.
  kiosk_apagar_min:
    name: "Kiosco: apagar pantalla tras"
    icon: mdi:monitor-off
    min: 0
    max: 120
    step: 5
    unit_of_measurement: "min"
    mode: slider
  # Pantalla sin toques: tras kiosk_atenuar_min baja al brillo sin uso del horario. Al tocarla vuelve.
  kiosk_atenuar_min:
    name: "Kiosco: atenuar tras"
    icon: mdi:timer-sand
    min: 1
    max: 60
    step: 1
    unit_of_measurement: "min"
    mode: slider
  # El brillo (0-255) al que vuelve la pantalla al tocarla: el de antes de atenuarla o apagarla.
  kiosk_brillo_previo:
    name: "Kiosco: brillo antes de atenuar"
    icon: mdi:brightness-auto
    min: 1
    max: 255
    step: 1
    mode: box
  # Tamaño de la tarjeta Media en tiles de la grilla (192 × 96 px cada uno): ancho × alto.
  # Mínimo 2 × 2 para que entren los controles; en el kiosco de 5" la columna entra 3 tiles de ancho.
  kiosk_media_ancho:
    name: "Ancho"
    icon: mdi:arrow-expand-horizontal
    min: 2
    max: 4
    step: 1
    unit_of_measurement: "tiles"
    mode: slider
  kiosk_media_alto:
    name: "Alto"
    icon: mdi:arrow-expand-vertical
    min: 2
    max: 6
    step: 1
    unit_of_measurement: "tiles"
    mode: slider

# Qué Haze muestra la tarjeta Media del kiosco (los tres puntos de arriba a la derecha abren un desplegable).
# Cada opción es el prefijo de las entidades de un Haze ("haze_pc" → sensor.haze_pc_estado, ...).
# La automatización kiosk_haze_opciones rearma la lista con los Haze que existan, con haze_mrtn_main
# primero: es la opción por defecto cuando no hay ninguna elegida.
# Encendido mientras la pantalla está atenuada por falta de uso (lo maneja kiosk_brillo_nocturno).
input_boolean:
  kiosk_atenuado:
    name: "Kiosco: pantalla atenuada"
    icon: mdi:brightness-5
  # Encendido mientras la pantalla está apagada por falta de uso (lo maneja kiosk_apagar_pantalla).
  kiosk_apagado:
    name: "Kiosco: pantalla apagada"
    icon: mdi:monitor-off

input_select:
  kiosk_haze:
    name: "Haze"
    icon: mdi:music-box-multiple
    options:
      - haze_mrtn_main
      - haze_pc

# Lo que abren los tres puntos de la tarjeta Media: un diálogo con el desplegable de Haze y el tamaño.
group:
  kiosk_media:
    name: "Media"
    entities:
      - input_select.kiosk_haze
      - input_number.kiosk_media_ancho
      - input_number.kiosk_media_alto

# La cola de Haze (lista de canciones del kiosco) pesa decenas de KB: no se guarda en la base.
# La hora (HH:MM), para que los botones de horarios del kiosco se repinten al cambiar de horario.
template:
  - sensor:
      - name: "Kiosco: hora"
        unique_id: kiosk_hora
        default_entity_id: sensor.kiosk_hora
        icon: mdi:clock-outline
        state: "{{ now().strftime('%H:%M') }}"

recorder:
  exclude:
    entities:
      - sensor.kiosk_hora
    entity_globs:
      - sensor.haze_*_cola

automation:
  # Lista de Haze para input_select.kiosk_haze: un Haze nuevo aparece solo al crearse sus entidades
  # por MQTT discovery. Sale del registro (integration_entities), no de los estados, porque al
  # crearse la entidad puede no tener estado todavía.
  - id: kiosk_haze_opciones
    alias: "Kiosco: lista de Haze"
    mode: queued
    trigger:
      - platform: homeassistant
        event: start
      - platform: event
        event_type: entity_registry_updated
    variables:
      haze: >-
        {% set todos = integration_entities('mqtt') | select('match', 'sensor\.haze_.*_estado$')
             | map('regex_replace', '^sensor\.(.*)_estado$', '\\1') | sort | list %}
        {{ (['haze_mrtn_main'] if 'haze_mrtn_main' in todos else []) + (todos | reject('eq', 'haze_mrtn_main') | list) }}
    condition:
      - condition: template
        value_template: "{{ haze | count > 0 and haze != state_attr('input_select.kiosk_haze', 'options') }}"
    action:
      - service: input_select.set_options
        target:
          entity_id: input_select.kiosk_haze
        data:
          options: "{{ haze }}"

  # Brillo de la pantalla del kiosco según la hora y si alguien la usa.
  # - A cada hora de kiosk_horarios pone el brillo de ese horario.
  # - Tras kiosk_atenuar_min sin toques guarda el brillo que tenía (kiosk_brillo_previo) y baja al
  #   brillo sin uso del horario actual.
  # - Al tocarla vuelve al brillo guardado, el de justo antes de atenuarse (aunque fuera a mano).
  #   Si mientras estaba atenuada empieza otro horario, al tocarla vuelve al brillo del horario nuevo.
  # kiosk_atenuado marca que el brillo actual es el atenuado: así, si se repite el disparo (la Pi
  # se reconecta y last_active pasa por "unknown"), no se guarda el brillo atenuado como el previo.
  # last_active son los minutos desde el último toque: TouchKio lo pone en 0 al tocar.
  - id: kiosk_brillo_nocturno
    alias: "Kiosco: brillo según hora y uso"
    mode: queued
    trigger:
      # Al llegar a una de las horas de la lista (now() se reevalúa cada minuto)
      - platform: template
        value_template: >-
          {{ (';' ~ now().strftime('%H:%M') ~ '=') in (';' ~ states('input_text.kiosk_horarios')) }}
        id: horario
      - platform: template
        value_template: >-
          {% set m = states('sensor.touchkio_mrtn_hub_last_active') %}
          {{ m | is_number and m | int >= states('input_number.kiosk_atenuar_min') | int(5) }}
        id: sin_uso
      - platform: template
        value_template: >-
          {% set m = states('sensor.touchkio_mrtn_hub_last_active') %}
          {{ m | is_number and m | int < states('input_number.kiosk_atenuar_min') | int(5) }}
        id: en_uso
    variables:
      pantalla: light.touchkio_mrtn_hub_display
      atenuado: "{{ is_state('input_boolean.kiosk_atenuado', 'on') }}"
      # El horario actual: el último que ya empezó hoy, o si no, el último de la lista (viene de ayer).
      horario: >-
        {% set ns = namespace(l=[]) %}
        {% for p in states('input_text.kiosk_horarios').split(';') %}
          {% set kv = p.split('=') %}
          {% if kv | count == 2 and kv[0] | length == 5 %}
            {% set v = kv[1].split('/') %}
            {% set ns.l = ns.l + [{'t': kv[0], 'b': v[0] | int(50), 'a': v[-1] | int(5)}] %}
          {% endif %}
        {% endfor %}
        {% set l = ns.l | sort(attribute='t') %}
        {% set antes = l | selectattr('t', 'le', now().strftime('%H:%M')) | list %}
        {{ (antes | last) if antes else ((l | last) if l else {'t': '', 'b': 50, 'a': 5}) }}
      brillo_hora: "{{ [horario.b | int(50), 1] | max }}"
      brillo_sin_uso: "{{ [horario.a | int(5), 1] | max }}"
    action:
      - choose:
          # Sin uso: guardar el brillo actual (0-255, sin redondear) y atenuar
          - conditions:
              - condition: trigger
                id: sin_uso
              - condition: template
                # Si se apaga antes o a la vez que se atenúa, no atenuar: subirle el brillo la prende
                value_template: >-
                  {% set apagar = states('input_number.kiosk_apagar_min') | int(0) %}
                  {{ not atenuado and is_state(pantalla, 'on') and not (0 < apagar <= states('input_number.kiosk_atenuar_min') | int(5)) }}
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.kiosk_brillo_previo
                data:
                  value: "{{ [state_attr(pantalla, 'brightness') | int(0), 1] | max }}"
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.kiosk_atenuado
              - service: light.turn_on
                target:
                  entity_id: "{{ pantalla }}"
                data:
                  brightness_pct: "{{ brillo_sin_uso }}"
          # La tocaron: volver al brillo guardado
          - conditions:
              - condition: trigger
                id: en_uso
              - condition: template
                value_template: "{{ atenuado }}"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.kiosk_atenuado
              - service: light.turn_on
                target:
                  entity_id: "{{ pantalla }}"
                data:
                  brightness: "{{ states('input_number.kiosk_brillo_previo') | int(128) }}"
          # Cambio de horario con la pantalla apagada: no prenderla. Si la apagó la falta de uso,
          # al tocarla vuelve con el brillo de la hora nueva; si se apagó a mano, no se toca.
          - conditions:
              - condition: trigger
                id: horario
              - condition: template
                value_template: "{{ not is_state(pantalla, 'on') }}"
            sequence:
              - if:
                  - condition: state
                    entity_id: input_boolean.kiosk_apagado
                    state: "on"
                then:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.kiosk_brillo_previo
                    data:
                      value: "{{ [(brillo_hora * 2.55) | round(0) | int, 1] | max }}"
          # Cambio de horario con la pantalla atenuada: queda atenuada (al nivel de la hora
          # nueva) y al tocarla vuelve al brillo de la hora nueva
          - conditions:
              - condition: trigger
                id: horario
              - condition: template
                value_template: "{{ atenuado }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.kiosk_brillo_previo
                data:
                  value: "{{ [(brillo_hora * 2.55) | round(0) | int, 1] | max }}"
              - service: light.turn_on
                target:
                  entity_id: "{{ pantalla }}"
                data:
                  brightness_pct: "{{ brillo_sin_uso }}"
          # Cambio de horario con la pantalla en uso
          - conditions:
              - condition: trigger
                id: horario
            sequence:
              - service: light.turn_on
                target:
                  entity_id: "{{ pantalla }}"
                data:
                  brightness_pct: "{{ brillo_hora }}"

  # Apaga la pantalla del kiosco tras kiosk_apagar_min sin toques (0 = nunca) y la prende al tocarla.
  # Si estaba atenuada, al tocarla la vuelve a prender kiosk_brillo_nocturno con el brillo guardado;
  # si no, se prende acá con kiosk_brillo_previo: el que tenía al apagarse, o el de la hora nueva si
  # mientras estaba apagada empezó otro horario. kiosk_apagado marca que la apagó esta
  # automatización, así no prende una pantalla que se apagó a mano.
  - id: kiosk_apagar_pantalla
    alias: "Kiosco: apagar pantalla sin uso"
    mode: queued
    trigger:
      - platform: template
        value_template: >-
          {% set m = states('sensor.touchkio_mrtn_hub_last_active') %}
          {% set lim = states('input_number.kiosk_apagar_min') | int(0) %}
          {{ lim > 0 and m | is_number and m | int >= lim }}
        id: sin_uso
      # Respaldo: si algo la prende cuando ya pasaron los minutos sin uso (el trigger de arriba
      # dispara una sola vez, al cruzar el umbral), la apaga tras kiosk_apagar_min prendida.
      - platform: state
        entity_id: light.touchkio_mrtn_hub_display
        to: "on"
        for:
          minutes: "{{ [states('input_number.kiosk_apagar_min') | int(0), 1] | max }}"
        id: sin_uso_prendida
      - platform: template
        value_template: >-
          {% set m = states('sensor.touchkio_mrtn_hub_last_active') %}
          {{ m | is_number and m | int < 1 }}
        id: en_uso
    variables:
      pantalla: light.touchkio_mrtn_hub_display
    action:
      - choose:
          - conditions:
              - condition: trigger
                id:
                  - sin_uso
                  - sin_uso_prendida
              - condition: template
                value_template: >-
                  {% set m = states('sensor.touchkio_mrtn_hub_last_active') %}
                  {% set lim = states('input_number.kiosk_apagar_min') | int(0) %}
                  {{ is_state(pantalla, 'on') and lim > 0 and m | is_number and m | int >= lim }}
            sequence:
              # Atenuada: el brillo de antes de atenuar ya está guardado
              - if:
                  - condition: state
                    entity_id: input_boolean.kiosk_atenuado
                    state: "off"
                then:
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.kiosk_brillo_previo
                    data:
                      value: "{{ [state_attr(pantalla, 'brightness') | int(0), 1] | max }}"
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.kiosk_apagado
              - service: light.turn_off
                target:
                  entity_id: "{{ pantalla }}"
          - conditions:
              - condition: trigger
                id: en_uso
              - condition: state
                entity_id: input_boolean.kiosk_apagado
                state: "on"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.kiosk_apagado
              # Atenuada: la prende kiosk_brillo_nocturno con el brillo de antes de atenuar
              - if:
                  - condition: state
                    entity_id: input_boolean.kiosk_atenuado
                    state: "off"
                then:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ pantalla }}"
                    data:
                      brightness: "{{ states('input_number.kiosk_brillo_previo') | int(128) }}"

  # Si nadie toca la pantalla un rato, el kiosco vuelve a su página de inicio (Overview).
  # last_active son los minutos desde el último toque; dispara una vez al pasar el umbral.
  # El botón "refresh" de TouchKio recarga la página actual (no la de inicio). En cambio, al
  # escribirle una URL a text.touchkio_..._page_url, TouchKio la carga: se le manda Overview con
  # el mismo host que ya usa la Pi. Se manda siempre (no se mira si ya está en Overview) porque
  # las pestañas cambian sin recargar la página y ese estado puede no enterarse.
  - id: kiosk_volver_overview
    alias: "Kiosco: volver a Overview por inactividad"
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.touchkio_mrtn_hub_last_active
        above: input_number.kiosk_inactividad_min
    variables:
      actual: "{{ states('text.touchkio_mrtn_hub_page_url') }}"
      overview: "{{ actual | regex_replace('^(https?://[^/]+).*$', '\\\\1') }}/dashboard-kiosk/overview#overview"
    condition:
      - condition: template
        value_template: "{{ actual.startswith('http') }}"
    action:
      - service: text.set_value
        target:
          entity_id: text.touchkio_mrtn_hub_page_url
        data:
          value: "{{ overview }}"

  # Luces "Auto lights" según luces_horarios: a cada hora de la lista, las prendidas van al brillo de
  # ese horario (0 = se apagan). Las que se prenden durante un horario con brillo también van a ese
  # brillo; en uno con 0 no se tocan. Si después las subís a mano, no las vuelve a bajar.
  - id: luces_atenuar_noche
    alias: "Luces: brillo según horario"
    mode: queued
    trigger:
      - platform: template
        value_template: >-
          {{ (';' ~ now().strftime('%H:%M') ~ '=') in (';' ~ states('input_text.luces_horarios')) }}
        id: hora
      - platform: event
        event_type: state_changed
        id: prendida
    condition:
      # Lo barato primero: esto corre con cada cambio de estado de HA.
      - condition: template
        value_template: >-
          {% if trigger.id == 'hora' %}
            {{ label_entities('auto_lights') | select('match', 'light\.') | select('is_state', 'on') | list | count > 0 }}
          {% else %}
            {% set e = trigger.event.data %}
            {{ e.entity_id.startswith('light.')
               and e.new_state is not none and e.new_state.state == 'on'
               and (e.old_state is none or e.old_state.state != 'on')
               and e.entity_id in label_entities('auto_lights') }}
          {% endif %}
    action:
      - variables:
          brillo: >-
            {% set ns = namespace(l=[]) %}
            {% for p in states('input_text.luces_horarios').split(';') %}
              {% set kv = p.split('=') %}
              {% if kv | count == 2 and kv[0] | length == 5 %}
                {% set ns.l = ns.l + [{'t': kv[0], 'b': kv[1] | int(0)}] %}
              {% endif %}
            {% endfor %}
            {% set l = ns.l | sort(attribute='t') %}
            {% set antes = l | selectattr('t', 'le', now().strftime('%H:%M')) | list %}
            {{ ((antes | last) if antes else ((l | last) if l else {'b': 0})).b }}
          luces: >-
            {% if trigger.id == 'hora' %}
              {{ label_entities('auto_lights') | select('match', 'light\.') | select('is_state', 'on') | list }}
            {% else %}
              {{ [trigger.event.data.entity_id] }}
            {% endif %}
      - choose:
          - conditions: "{{ brillo | int(0) > 0 }}"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: "{{ luces }}"
                data:
                  brightness_pct: "{{ brillo }}"
          # 0 = apagar, solo a la hora (las que se prenden después no se tocan)
          - conditions: "{{ trigger.id == 'hora' }}"
            sequence:
              - service: light.turn_off
                target:
                  entity_id: "{{ luces }}"
