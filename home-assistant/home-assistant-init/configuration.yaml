# Loads default set of integrations. Do not remove.
default_config:
# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  # card-mod has to load before the dashboards for theme-wide styles; athanor.js holds the fonts,
  # the status line and the hero card of the Athanor themes
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js?hacstag=190927524421
    - /local/athanor/athanor.js?v=5
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

homeassistant:
  packages: !include_dir_named packages
  allowlist_external_dirs:
    - /config/www/snapshots

sensor:
  - platform: folder
    folder: /config/www/snapshots

shell_command:
  limpiar_snapshots: "rm -f /config/www/snapshots/captura_*.jpg"
  apagar_pc: 'ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i /config/.ssh/id_ed25519 martin@192.168.0.10 "shutdown /s /t 0"'
  wake_pc: 'ssh -o StrictHostKeyChecking=no -o BatchMode=yes -i /config/.ssh/id_ed25519 tincho@192.168.0.100 "sh /home/tincho/Projects/docker-images/home-assistant/scripts/wake_on_lan.sh"'

http:
  use_x_forwarded_for: true
  trusted_proxies:
    # Redes de Docker: la subred de "home" no es la misma en Windows (172.21) que en Linux (172.18)
    - 172.16.0.0/12

rest:
  - resource: http://frigate:5000/api/stats
    scan_interval: 30
    sensor:
      - name: "GPU Uso Frigate"
        value_template: "{{ value_json.gpu_usages['NVIDIA GeForce RTX 2060 SUPER'].gpu | replace('%','') }}"
        unit_of_measurement: "%"

  - resource: http://host.docker.internal:61208/api/4/sensors
    scan_interval: 30
    sensor:
      - name: "CPU Temperatura"
        # Sin el sensor (por ejemplo, sin el módulo coretemp) queda no disponible en vez de dar error
        availability: >-
          {{ value_json | selectattr('label', 'eq', 'Package id 0') | list | count > 0 }}
        value_template: >-
          {{ value_json | selectattr('label', 'eq', 'Package id 0') | map(attribute='value') | first | default(0) | float(0) }}
        unit_of_measurement: "°C"
        device_class: temperature

  - resource: http://host.docker.internal:61208/api/4/cpu
    scan_interval: 30
    sensor:
      - name: "CPU Uso Porcentaje"
        value_template: "{{ value_json.total | float(0) }}"
        unit_of_measurement: "%"

  - resource: http://host.docker.internal:61208/api/4/gpu
    scan_interval: 30
    sensor:
      - name: "GPU Temperatura"
        value_template: "{{ value_json[0].temperature | float(0) }}"
        unit_of_measurement: "°C"
        device_class: temperature

  - resource: http://host.docker.internal:61208/api/4/fs
    scan_interval: 60
    sensor:
      - name: "Disco Espacio Libre"
        value_template: >-
          {{ ((value_json | selectattr('mnt_point', 'eq', '/') | first).free / 1024**3) | round(1) }}
        unit_of_measurement: "GB"
        device_class: data_size
      - name: "Disco Espacio Total"
        value_template: >-
          {{ ((value_json | selectattr('mnt_point', 'eq', '/') | first).size / 1024**3) | round(1) }}
        unit_of_measurement: "GB"
        device_class: data_size
      - name: "Disco Uso Porcentaje"
        value_template: "{{ (value_json | selectattr('mnt_point', 'eq', '/') | first).percent }}"
        unit_of_measurement: "%"

  - resource: http://host.docker.internal:61208/api/4/mem
    scan_interval: 30
    sensor:
      - name: "RAM Uso Porcentaje"
        value_template: "{{ value_json.percent }}"
        unit_of_measurement: "%"
      - name: "RAM Usada"
        value_template: "{{ (value_json.used / 1024**3) | round(2) }}"
        unit_of_measurement: "GB"
        device_class: data_size
      - name: "RAM Disponible"
        value_template: "{{ (value_json.available / 1024**3) | round(2) }}"
        unit_of_measurement: "GB"
        device_class: data_size
