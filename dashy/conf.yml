pageInfo:
  title: mrtn-server
  description: Servicios del server
  navLinks:
    - title: Docs de Dashy
      path: https://dashy.to/docs

appConfig:
  theme: glass
  layout: auto
  iconSize: large
  language: es
  statusCheck: true
  statusCheckInterval: 120
  hideComponents:
    hideFooter: true

sections:
  - name: Domótica
    icon: fas fa-house-signal
    items:
      - title: Home Assistant
        description: Panel de la casa
        icon: hl-home-assistant
        url: http://mrtn-server.tailbce521.ts.net:8123
      - title: ESPHome
        description: Firmware de los ESP
        icon: hl-esphome
        url: http://mrtn-server.tailbce521.ts.net:6052
      - title: Frigate
        description: Cámaras y detección
        icon: hl-frigate
        url: http://mrtn-server.tailbce521.ts.net:5000
        statusCheck: false   # apagado por ahora (perfil "frigate" en home-assistant)
      - title: RuView
        description: Presencia por WiFi · Solo por Tailscale
        icon: fas fa-wifi
        url: http://mrtn-server.tailbce521.ts.net:3080/ui/index.html
        statusCheck: false

  - name: Red y sistema
    icon: fas fa-network-wired
    items:
      - title: AdGuard Home
        description: DNS y bloqueo de ads
        icon: hl-adguard-home
        url: http://mrtn-server.tailbce521.ts.net:3000
      - title: Glances
        description: Uso de CPU, RAM y disco
        icon: hl-glances
        url: http://mrtn-server.tailbce521.ts.net:61208
      - title: Dozzle
        description: Logs de los contenedores
        icon: hl-dozzle
        url: http://mrtn-server.tailbce521.ts.net:8080
      - title: Beszel
        description: Métricas del server y los contenedores
        icon: hl-beszel
        url: http://mrtn-server.tailbce521.ts.net:8090
      - title: Kopia
        description: Backups
        icon: hl-kopia
        url: http://mrtn-server.tailbce521.ts.net:51515
        statusCheckAcceptCodes: "401"
      - title: Consumo PC
        description: Solo por Tailscale
        icon: fas fa-bolt
        url: http://mrtn-server.tailbce521.ts.net:8787

  - name: Automatización
    icon: fas fa-robot
    items:
      - title: n8n
        description: Workflows
        icon: hl-n8n
        url: http://mrtn-server.tailbce521.ts.net:5678
      - title: WAHA
        description: API de WhatsApp
        icon: hl-whatsapp
        url: http://mrtn-server.tailbce521.ts.net:3001/dashboard
        statusCheckAcceptCodes: "401"
      - title: Job Autoapply
        description: Solo por Tailscale
        icon: fas fa-briefcase
        url: http://mrtn-server.tailbce521.ts.net:4517
      - title: Autoapply noVNC
        description: Solo por Tailscale
        icon: fas fa-display
        url: http://mrtn-server.tailbce521.ts.net:6080

  - name: Finanzas
    icon: fas fa-chart-line
    items:
      - title: Quant Bot
        description: Bot de inversión (paper) · Solo por Tailscale
        icon: fas fa-chart-line
        url: http://mrtn-server.tailbce521.ts.net:8788
